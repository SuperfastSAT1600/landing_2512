name: Daily Blog Topic Suggestions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '콘솔 출력만 (Slack 미발송)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  suggest-topics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate and send topics
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SUPERFASTSAT_V2_SUPABASE_URL: ${{ secrets.SUPERFASTSAT_V2_SUPABASE_URL }}
          SUPERFASTSAT_V2_SUPABASE_SERVICE_KEY: ${{ secrets.SUPERFASTSAT_V2_SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node blog-agent/scripts/suggest-topics.js --json
          else
            node blog-agent/scripts/suggest-topics.js
          fi

      - name: Commit updated topic files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog-agent/data/posted-topics.json blog-agent/data/today-topics.json
          git diff --staged --quiet || git commit -m "chore: daily topic suggestions $(date -u +%Y-%m-%d)"
          git push
