<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강원 FC × 러너스 LRS</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #6085FF;
  --bg: #09090b;
  --border: rgba(255,255,255,0.1);
  --border-card: rgba(255,255,255,0.08);
  --mute: #94a3b8;
  --error: #f87171;
}

html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: #fff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Nav ─────────────────────────────────────────────────── */
#topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(9,9,11,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 0.5px solid var(--border);
  height: 48px;
  display: flex; align-items: center;
  padding: 0 clamp(20px, 5vw, 60px);
}
.brand { font-size: 11px; font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; color: #fff; }

/* ── Hero ────────────────────────────────────────────────── */
.hero {
  position: relative; overflow: hidden;
  padding: 120px clamp(20px, 5vw, 60px) 64px;
}
.hero-glow {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 15% 50%, rgba(96,133,255,0.08) 0%, transparent 55%);
}
.hero-inner { max-width: 720px; margin: 0 auto; position: relative; }

.accent-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.accent-bar .line { height: 1px; width: 40px; background: var(--accent); }
.accent-bar .label { font-size: 9px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); }

.hero-title { font-size: clamp(36px, 7vw, 64px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 16px; }
.hero-sub { font-size: 14px; color: var(--mute); line-height: 1.7; max-width: 480px; }

/* ── Main content ─────────────────────────────────────────── */
.content {
  max-width: 720px; margin: 0 auto;
  padding: 0 clamp(20px, 5vw, 60px) 100px;
}
.section-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 20px;
  display: flex; align-items: center; gap: 10px;
}
.section-label::before { content: ''; display: block; height: 1px; width: 24px; background: var(--accent); }

/* ── PIN card ─────────────────────────────────────────────── */
.pin-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-card);
  border-radius: 20px;
  padding: 36px 32px;
}
.pin-card-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.pin-card-desc { font-size: 13px; color: var(--mute); margin-bottom: 32px; line-height: 1.5; }

/* ── PIN boxes ────────────────────────────────────────────── */
.pin-boxes { display: flex; gap: 10px; margin-bottom: 20px; }
.pin-boxes input {
  width: 44px; height: 52px;
  border-radius: 12px;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.04);
  color: #fff;
  font-size: 22px; font-weight: 700; text-align: center;
  outline: none; caret-color: transparent;
  transition: border-color 0.15s, background 0.15s;
  -webkit-appearance: none;
}
.pin-boxes input:focus {
  border-color: var(--accent);
  background: rgba(96,133,255,0.1);
}
.pin-boxes input.filled {
  border-color: var(--accent);
  background: rgba(96,133,255,0.1);
}

.error-msg { font-size: 13px; color: var(--error); min-height: 20px; margin-bottom: 16px; }

.btn-submit {
  width: 100%; padding: 14px; border: none; border-radius: 14px;
  font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  cursor: pointer; transition: background 0.15s, opacity 0.15s;
  background: var(--accent); color: #fff;
}
.btn-submit:disabled { opacity: 0.35; cursor: default; }

.spinner {
  display: inline-block; width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff;
  border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Feedback result ──────────────────────────────────────── */
#fb-result { display: none; margin-top: 40px; }

.fb-header { margin-bottom: 28px; }
.fb-eyebrow { font-size: 9px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.fb-title { font-size: clamp(22px, 4vw, 36px); font-weight: 800; letter-spacing: -0.01em; margin-bottom: 6px; }
.fb-meta { font-size: 13px; color: var(--mute); }

.fb-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-card);
  border-radius: 20px; overflow: hidden;
}
.fb-section {
  padding: 24px 28px; border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 10px;
}
.fb-section:last-child { border-bottom: none; }
.fb-section-label { font-size: 9px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--mute); }
.fb-section-text { font-size: 14px; line-height: 1.75; color: rgba(255,255,255,0.85); white-space: pre-wrap; word-break: break-word; }
.fb-section-text a { color: var(--accent); text-decoration: underline; word-break: break-all; }

.fb-student-item { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.fb-student-item:last-child { margin-bottom: 0; }
.fb-student-name { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; }
.fb-student-note { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.6; }

.btn-reset {
  margin-top: 20px; background: none; border: none;
  font-size: 12px; color: var(--mute); letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.15s;
}
.btn-reset:hover { color: #fff; }
</style>
</head>
<body>

<nav id="topnav">
  <span class="brand">강원 FC × Runners LRS</span>
</nav>

<section class="hero">
  <div class="hero-glow"></div>
  <div class="hero-inner">
    <div class="accent-bar">
      <div class="line"></div>
      <span class="label">영어 인터뷰 수업 포털</span>
    </div>
    <h1 class="hero-title">강원 FC<br>U-18</h1>
    <p class="hero-sub">러너스 LRS와 함께하는 강원 FC U-18 영어 인터뷰 수업 포털입니다.</p>
  </div>
</section>

<div class="content">
  <div class="section-label">수업 피드백</div>

  <div class="pin-card">
    <div class="pin-card-title">레슨 피드백 확인</div>
    <div class="pin-card-desc">수업 후 강사에게 받은 6자리 번호를 입력하세요.</div>

    <div class="pin-boxes" id="pin-boxes">
      <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
    </div>
    <div class="error-msg" id="error-msg"></div>
    <button class="btn-submit" id="submit-btn" disabled onclick="submitPin()">확인하기</button>
  </div>

  <!-- 피드백 결과 -->
  <div id="fb-result">
    <div class="fb-header">
      <div class="fb-eyebrow" id="fb-eyebrow">레슨 피드백</div>
      <div class="fb-title" id="fb-title">—</div>
      <div class="fb-meta" id="fb-meta">—</div>
    </div>
    <div class="fb-card">
      <div class="fb-section" id="fb-sec-content">
        <div class="fb-section-label">이번 수업 내용</div>
        <div class="fb-section-text" id="fb-content-text"></div>
      </div>
      <div class="fb-section" id="fb-sec-students" style="display:none;">
        <div class="fb-section-label">학생별 메모</div>
        <div id="fb-student-list"></div>
      </div>
      <div class="fb-section" id="fb-sec-hw" style="display:none;">
        <div class="fb-section-label">숙제</div>
        <div class="fb-section-text" id="fb-hw-text"></div>
      </div>
    </div>
    <button class="btn-reset" onclick="resetPin()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      다른 번호로 확인
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL  = 'https://ualucbrrfvysmfytkdew.supabase.co';
const SB_ANON = 'sb_publishable_nmqBIh-y6etZMXmxrUxbqA_t5uIIIOp';
const sb = supabase.createClient(SB_URL, SB_ANON);

const UNIT_LABELS = {
  unit1: 'Unit 1 — Self-Introduction & Joining the Team',
  unit2: 'Unit 2 — Win / Lose Interview'
};

function getInputs() { return Array.from(document.querySelectorAll('#pin-boxes input')); }

function getPinValue() { return getInputs().map(el => el.value).join(''); }

function initPinBoxes() {
  getInputs().forEach((input, i, all) => {
    input.addEventListener('input', () => {
      const digit = input.value.replace(/\D/g, '').slice(-1);
      input.value = digit;
      input.classList.toggle('filled', !!digit);
      if (digit && i < 5) all[i + 1].focus();
      document.getElementById('submit-btn').disabled = getPinValue().length < 6;
      document.getElementById('error-msg').textContent = '';
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !input.value && i > 0) {
        e.preventDefault();
        all[i - 1].value = '';
        all[i - 1].classList.remove('filled');
        all[i - 1].focus();
        document.getElementById('submit-btn').disabled = true;
      } else if (e.key === 'Enter' && getPinValue().length === 6) {
        submitPin();
      }
    });

    input.addEventListener('paste', e => {
      e.preventDefault();
      const digits = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
      getInputs().forEach((el, j) => {
        el.value = digits[j] || '';
        el.classList.toggle('filled', !!digits[j]);
      });
      document.getElementById('submit-btn').disabled = digits.length < 6;
      if (digits.length > 0) all[Math.min(digits.length, 5)].focus();
    });

    input.addEventListener('focus', () => input.select());
  });
}

async function submitPin() {
  const pin = getPinValue();
  if (pin.length !== 6) return;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const { data, error } = await sb
    .from('b2b_lesson_feedback').select('*')
    .eq('pin', pin).order('created_at', { ascending: false }).limit(1);

  btn.innerHTML = '확인하기'; btn.disabled = false;

  if (error || !data || !data.length) {
    document.getElementById('error-msg').textContent = '일치하는 피드백이 없습니다. 번호를 확인해주세요.';
    getInputs().forEach(el => { el.value = ''; el.classList.remove('filled'); });
    getInputs()[0].focus();
    return;
  }
  renderFeedback(data[0]);
}

function renderFeedback(fb) {
  const unitLabel = UNIT_LABELS[fb.unit] || fb.unit || '—';
  const dateStr = fb.lesson_date
    ? new Date(fb.lesson_date + 'T00:00:00').toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })
    : '—';

  document.getElementById('fb-eyebrow').textContent = '레슨 피드백';
  document.getElementById('fb-title').textContent = unitLabel;
  document.getElementById('fb-meta').textContent = dateStr;
  document.getElementById('fb-content-text').innerHTML = linkify(fb.lesson_content || '—');

  const studentList = document.getElementById('fb-student-list');
  const studentSec  = document.getElementById('fb-sec-students');
  studentList.innerHTML = '';
  const notes = fb.student_notes;
  if (notes && Array.isArray(notes) && notes.length) {
    notes.forEach(s => {
      const item = document.createElement('div');
      item.className = 'fb-student-item';
      item.innerHTML = `<div class="fb-student-name">${escHtml(s.name||'—')}</div><div class="fb-student-note">${escHtml(s.note||'—')}</div>`;
      studentList.appendChild(item);
    });
    studentSec.style.display = 'flex';
  } else { studentSec.style.display = 'none'; }

  const hwSec = document.getElementById('fb-sec-hw');
  const hwText = document.getElementById('fb-hw-text');
  if (fb.homework) { hwText.innerHTML = linkify(fb.homework); hwSec.style.display = 'flex'; }
  else { hwSec.style.display = 'none'; }

  document.getElementById('fb-result').style.display = 'block';
  document.getElementById('fb-result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetPin() {
  getInputs().forEach(el => { el.value = ''; el.classList.remove('filled'); });
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('fb-result').style.display = 'none';
  document.getElementById('error-msg').textContent = '';
  getInputs()[0].focus();
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function linkify(str) {
  return escHtml(str).replace(/(https?:\/\/[^\s&]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

initPinBoxes();
</script>
</body>
</html>
