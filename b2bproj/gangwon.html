<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강원 FC × 러너스 LRS</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #6085FF;
  --bg: #09090b;
  --border: rgba(255,255,255,0.1);
  --mute: #94a3b8;
  --error: #f87171;
  --success: #4ade80;
}

html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: #fff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Nav ─────────────────────────────────────────────────── */
#topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(9,9,11,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 0.5px solid var(--border);
  height: 48px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 clamp(20px, 5vw, 60px);
}
.brand { font-size: 11px; font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; color: #fff; }
.nav-btn {
  font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--mute); background: none; border: none; cursor: pointer; transition: color 0.15s;
}
.nav-btn:hover { color: #fff; }

/* ── Hero ────────────────────────────────────────────────── */
.hero {
  position: relative; overflow: hidden;
  padding: 120px clamp(20px, 5vw, 60px) 64px;
}
.hero-glow {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 15% 50%, rgba(96,133,255,0.08) 0%, transparent 55%);
}
.hero-inner { max-width: 720px; margin: 0 auto; position: relative; }
.accent-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.accent-bar .line { height: 1px; width: 40px; background: var(--accent); }
.accent-bar .label { font-size: 9px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); }
.hero-title { font-size: clamp(36px, 7vw, 64px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 16px; }
.hero-sub { font-size: 14px; color: var(--mute); line-height: 1.7; max-width: 480px; }

/* ── Content ─────────────────────────────────────────────── */
.content { max-width: 720px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 60px) 100px; }
.section-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 20px;
  display: flex; align-items: center; gap: 10px;
}
.section-label::before { content: ''; display: block; height: 1px; width: 24px; background: var(--accent); }

/* ── Card base ───────────────────────────────────────────── */
.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px;
  margin-bottom: 16px;
}
.card-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.card-desc { font-size: 13px; color: var(--mute); margin-bottom: 28px; line-height: 1.5; }

/* ── PIN inputs ──────────────────────────────────────────── */
.pin-boxes { display: flex; gap: 10px; margin-bottom: 20px; }
.pin-boxes input {
  width: 44px; height: 52px;
  border-radius: 12px;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.04);
  color: #fff;
  font-size: 22px; font-weight: 700; text-align: center;
  outline: none; caret-color: transparent;
  transition: border-color 0.15s, background 0.15s;
  -webkit-appearance: none;
}
.pin-boxes input:focus { border-color: var(--accent); background: rgba(96,133,255,0.1); }
.pin-boxes input.filled { border-color: var(--accent); background: rgba(96,133,255,0.1); }

/* ── Buttons ─────────────────────────────────────────────── */
.btn-primary {
  width: 100%; padding: 14px; border: none; border-radius: 14px;
  font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  cursor: pointer; transition: opacity 0.15s;
  background: var(--accent); color: #fff;
}
.btn-primary:disabled { opacity: 0.35; cursor: default; }
.btn-ghost {
  background: none; border: none; font-size: 12px; color: var(--mute);
  letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  display: flex; align-items: center; gap: 6px; transition: color 0.15s; margin-top: 16px;
}
.btn-ghost:hover { color: #fff; }

/* ── Messages ────────────────────────────────────────────── */
.msg { font-size: 13px; min-height: 20px; margin-bottom: 16px; }
.msg.error { color: var(--error); }
.msg.success { color: var(--success); }

/* ── Spinner ─────────────────────────────────────────────── */
.spinner {
  display: inline-block; width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff;
  border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Feedback list ───────────────────────────────────────── */
.fb-item {
  border: 1px solid var(--border); border-radius: 16px;
  margin-bottom: 12px; overflow: hidden;
}
.fb-item-header {
  padding: 20px 24px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: background 0.15s;
}
.fb-item-header:hover { background: rgba(255,255,255,0.03); }
.fb-item-meta { font-size: 12px; color: var(--mute); margin-bottom: 4px; }
.fb-item-title { font-size: 15px; font-weight: 700; }
.fb-chevron { color: var(--mute); transition: transform 0.2s; flex-shrink: 0; }
.fb-item.open .fb-chevron { transform: rotate(90deg); }
.fb-item-body { display: none; border-top: 1px solid var(--border); }
.fb-item.open .fb-item-body { display: block; }

.fb-section { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.fb-section:last-child { border-bottom: none; }
.fb-section-label { font-size: 9px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--mute); }
.fb-section-text { font-size: 14px; line-height: 1.75; color: rgba(255,255,255,0.85); white-space: pre-wrap; word-break: break-word; }
.fb-section-text a { color: var(--accent); text-decoration: underline; word-break: break-all; }
.fb-student-item { margin-bottom: 12px; }
.fb-student-item:last-child { margin-bottom: 0; }
.fb-student-name { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
.fb-student-note { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.6; }

/* ── Change PIN modal ────────────────────────────────────── */
#change-pin-panel { display: none; margin-top: 40px; }
</style>
</head>
<body>

<nav id="topnav">
  <span class="brand">강원 FC × Runners LRS</span>
  <button class="nav-btn" id="nav-change-pin" style="display:none;" onclick="toggleChangePinPanel()">PIN 변경</button>
</nav>

<section class="hero">
  <div class="hero-glow"></div>
  <div class="hero-inner">
    <div class="accent-bar">
      <div class="line"></div>
      <span class="label">영어 인터뷰 수업 포털</span>
    </div>
    <h1 class="hero-title">강원 FC<br>U-18</h1>
    <p class="hero-sub">러너스 LRS와 함께하는 강원 FC U-18 영어 인터뷰 수업 포털입니다.</p>
  </div>
</section>

<div class="content">

  <!-- ── 로그인 카드 ───────────────────────────────────────── -->
  <div id="login-section">
    <div class="section-label">수업 피드백</div>
    <div class="card">
      <div class="card-title">비밀번호 입력</div>
      <div class="card-desc">구단 비밀번호 6자리를 입력하세요.</div>
      <div class="pin-boxes" id="login-pin-boxes">
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      </div>
      <div class="msg" id="login-msg"></div>
      <button class="btn-primary" id="login-btn" disabled onclick="doLogin()">확인하기</button>
    </div>
  </div>

  <!-- ── 피드백 목록 ──────────────────────────────────────── -->
  <div id="feedback-section" style="display:none;">
    <div class="section-label">레슨 피드백</div>
    <div id="feedback-list"></div>
    <button class="btn-ghost" onclick="doLogout()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      로그아웃
    </button>
  </div>

  <!-- ── PIN 변경 패널 ────────────────────────────────────── -->
  <div id="change-pin-panel">
    <div class="section-label">PIN 변경</div>
    <div class="card">
      <div class="card-title">새 비밀번호 설정</div>
      <div class="card-desc">새로운 6자리 비밀번호를 입력하세요.</div>
      <div class="pin-boxes" id="new-pin-boxes">
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      </div>
      <div class="msg" id="change-msg"></div>
      <button class="btn-primary" id="change-btn" disabled onclick="doChangePin()">변경하기</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL  = 'https://ualucbrrfvysmfytkdew.supabase.co';
const SB_ANON = 'sb_publishable_nmqBIh-y6etZMXmxrUxbqA_t5uIIIOp';
const sb = supabase.createClient(SB_URL, SB_ANON);

const CLUB_ID = 'gangwon';
const UNIT_LABELS = {
  unit1: 'Unit 1 — Self-Introduction & Joining the Team',
  unit2: 'Unit 2 — Win / Lose Interview'
};

/* ── PIN box helper ──────────────────────────────────────── */
function initPinBoxes(containerId, submitBtnId, onComplete) {
  const inputs = Array.from(document.querySelectorAll(`#${containerId} input`));
  const btn = document.getElementById(submitBtnId);

  function getVal() { return inputs.map(el => el.value).join(''); }

  inputs.forEach((input, i) => {
    input.addEventListener('input', () => {
      const digit = input.value.replace(/\D/g, '').slice(-1);
      input.value = digit;
      input.classList.toggle('filled', !!digit);
      if (digit && i < inputs.length - 1) inputs[i + 1].focus();
      btn.disabled = getVal().length < 6;
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !input.value && i > 0) {
        e.preventDefault();
        inputs[i - 1].value = '';
        inputs[i - 1].classList.remove('filled');
        inputs[i - 1].focus();
        btn.disabled = true;
      } else if (e.key === 'Enter' && getVal().length === 6) {
        onComplete();
      }
    });
    input.addEventListener('paste', e => {
      e.preventDefault();
      const digits = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
      inputs.forEach((el, j) => { el.value = digits[j] || ''; el.classList.toggle('filled', !!digits[j]); });
      btn.disabled = digits.length < 6;
      if (digits.length > 0) inputs[Math.min(digits.length, 5)].focus();
    });
    input.addEventListener('focus', () => input.select());
  });

  return { getVal, reset: () => { inputs.forEach(el => { el.value = ''; el.classList.remove('filled'); }); btn.disabled = true; inputs[0].focus(); } };
}

/* ── Login ───────────────────────────────────────────────── */
const loginBox = initPinBoxes('login-pin-boxes', 'login-btn', doLogin);

async function doLogin() {
  const pin = loginBox.getVal();
  if (pin.length !== 6) return;
  const btn = document.getElementById('login-btn');
  const msgEl = document.getElementById('login-msg');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const { data, error } = await sb
    .from('b2b_club_pins').select('pin').eq('club_id', CLUB_ID).single();

  btn.innerHTML = '확인하기';

  if (error || !data) {
    msgEl.className = 'msg error';
    msgEl.textContent = '오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
    btn.disabled = false;
    return;
  }

  if (data.pin !== pin) {
    msgEl.className = 'msg error';
    msgEl.textContent = '비밀번호가 일치하지 않습니다.';
    loginBox.reset();
    btn.disabled = true;
    return;
  }

  showFeedbackSection();
}

/* ── Feedback section ────────────────────────────────────── */
async function showFeedbackSection() {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('feedback-section').style.display = 'block';
  document.getElementById('nav-change-pin').style.display = 'block';

  const list = document.getElementById('feedback-list');
  list.innerHTML = '<div style="color:var(--mute);font-size:13px;padding:8px 0;">불러오는 중...</div>';

  const { data, error } = await sb
    .from('b2b_lesson_feedback').select('*')
    .eq('club_id', CLUB_ID)
    .order('lesson_date', { ascending: false });

  if (error || !data || !data.length) {
    list.innerHTML = '<div style="color:var(--mute);font-size:13px;padding:8px 0;">아직 등록된 피드백이 없습니다.</div>';
    return;
  }

  list.innerHTML = '';
  data.forEach(fb => list.appendChild(buildFeedbackItem(fb)));
}

function buildFeedbackItem(fb) {
  const unitLabel = UNIT_LABELS[fb.unit] || fb.unit || '—';
  const dateStr = fb.lesson_date
    ? new Date(fb.lesson_date + 'T00:00:00').toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })
    : '—';

  const item = document.createElement('div');
  item.className = 'fb-item';

  const sections = [];
  if (fb.lesson_content) {
    sections.push(`<div class="fb-section"><div class="fb-section-label">수업 내용</div><div class="fb-section-text">${linkify(fb.lesson_content)}</div></div>`);
  }
  if (fb.student_notes && Array.isArray(fb.student_notes) && fb.student_notes.length) {
    const notes = fb.student_notes.map(s =>
      `<div class="fb-student-item"><div class="fb-student-name">${escHtml(s.name||'—')}</div><div class="fb-student-note">${escHtml(s.note||'—')}</div></div>`
    ).join('');
    sections.push(`<div class="fb-section"><div class="fb-section-label">학생별 메모</div>${notes}</div>`);
  }
  if (fb.homework) {
    sections.push(`<div class="fb-section"><div class="fb-section-label">숙제</div><div class="fb-section-text">${linkify(fb.homework)}</div></div>`);
  }

  item.innerHTML = `
    <div class="fb-item-header" onclick="toggleItem(this)">
      <div>
        <div class="fb-item-meta">${dateStr}</div>
        <div class="fb-item-title">${escHtml(unitLabel)}</div>
      </div>
      <svg class="fb-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="fb-item-body">${sections.join('')}</div>
  `;
  return item;
}

function toggleItem(header) {
  header.parentElement.classList.toggle('open');
}

/* ── Change PIN ──────────────────────────────────────────── */
const newPinBox = initPinBoxes('new-pin-boxes', 'change-btn', doChangePin);

function toggleChangePinPanel() {
  const panel = document.getElementById('change-pin-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  newPinBox.reset();
  document.getElementById('change-msg').textContent = '';
  if (panel.style.display === 'block') panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function doChangePin() {
  const newPin = newPinBox.getVal();
  if (newPin.length !== 6) return;
  const btn = document.getElementById('change-btn');
  const msgEl = document.getElementById('change-msg');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const { error } = await sb
    .from('b2b_club_pins')
    .update({ pin: newPin, updated_at: new Date().toISOString() })
    .eq('club_id', CLUB_ID);

  btn.innerHTML = '변경하기';

  if (error) {
    msgEl.className = 'msg error'; msgEl.textContent = '변경 실패: ' + error.message;
    btn.disabled = false;
  } else {
    msgEl.className = 'msg success'; msgEl.textContent = '비밀번호가 변경되었습니다.';
    newPinBox.reset();
  }
}

/* ── Logout ──────────────────────────────────────────────── */
function doLogout() {
  document.getElementById('feedback-section').style.display = 'none';
  document.getElementById('change-pin-panel').style.display = 'none';
  document.getElementById('nav-change-pin').style.display = 'none';
  document.getElementById('login-section').style.display = 'block';
  loginBox.reset();
  document.getElementById('login-msg').textContent = '';
}

/* ── Helpers ─────────────────────────────────────────────── */
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function linkify(str) {
  return escHtml(str).replace(/(https?:\/\/[^\s&]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}
</script>
</body>
</html>
