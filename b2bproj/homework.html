<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숙제 결과 확인 · 러너스 LRS</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --night:   #000000;
  --night-s: #0a0a0a;
  --white:   #ffffff;
  --mute:    #5a5a5f;
  --muted:   #8a8a8f;
  --line:    #2a2a2f;
  --max:     1080px;
  --pad:     clamp(24px, 5vw, 80px);
}

html { scroll-behavior: smooth; }
body {
  background: var(--night);
  color: var(--white);
  font-family: Arial, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ── Nav ────────────────────────────────────────────────── */
#topnav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 0.5px solid var(--line);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 var(--pad); height: 48px;
}
.brand { font-size: 11px; font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; }
.nav-links { display: flex; gap: 20px; align-items: center; }
.nav-link {
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--mute); text-decoration: none; transition: color 0.15s;
}
.nav-link:hover { color: var(--white); }

/* ── Main ───────────────────────────────────────────────── */
.main {
  max-width: var(--max);
  margin: 0 auto;
  padding: 64px var(--pad) 120px;
}

/* ── Header ─────────────────────────────────────────────── */
.page-eyebrow {
  font-size: 9px; letter-spacing: 0.36em;
  text-transform: uppercase; color: var(--mute);
  display: block; margin-bottom: 20px;
}
.page-title {
  font-size: clamp(32px, 5vw, 56px);
  font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; line-height: 0.94;
  margin-bottom: 40px;
}
.hl { height: 0.5px; background: var(--line); margin-bottom: 40px; }

/* ── Unit tabs ──────────────────────────────────────────── */
.unit-tabs {
  display: flex; gap: 0; margin-bottom: 40px;
  border-bottom: 0.5px solid var(--line);
  overflow-x: auto;
}
.unit-tab {
  padding: 10px 20px;
  font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--mute); cursor: pointer;
  border-bottom: 1.5px solid transparent;
  margin-bottom: -0.5px;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.unit-tab:hover { color: var(--white); }
.unit-tab.active { color: var(--white); border-bottom-color: var(--white); }

/* ── Scoreboard (선수 기록표) ───────────────────────────── */
.scoreboard {
  border: 0.5px solid var(--line);
  background: var(--night-s);
  margin-bottom: 48px;
}
.sb-inner { padding: 28px 32px 24px; }

.sb-unit-row {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 28px;
}
.sb-unit-tag {
  font-size: 9px; letter-spacing: 0.36em;
  text-transform: uppercase; color: var(--mute);
}
.sb-unit-sub {
  font-size: 11px; color: var(--muted); letter-spacing: 0.06em;
}

.sb-stats {
  display: flex; align-items: stretch; gap: 0;
  margin-bottom: 24px;
}
.sb-stat {
  display: flex; flex-direction: column; gap: 8px;
  padding-right: 32px;
}
.sb-stat + .sb-stat {
  border-left: 0.5px solid var(--line);
  padding-left: 32px;
}
.sb-stat-num {
  font-size: clamp(40px, 5.5vw, 64px);
  font-weight: 700; letter-spacing: 0.02em;
  color: var(--white); line-height: 1;
}
.sb-stat-num-sm { font-size: clamp(22px, 3vw, 36px); }
.sb-stat-label {
  font-size: 8px; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--mute);
}

.sb-hl { height: 0.5px; background: var(--line); margin-bottom: 20px; }

.sb-roster-label {
  font-size: 8px; letter-spacing: 0.32em;
  text-transform: uppercase; color: var(--mute);
  margin-bottom: 12px;
}
.sb-roster { display: flex; flex-wrap: wrap; gap: 8px; min-height: 28px; }
.sb-chip {
  font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--white);
  border: 0.5px solid var(--line);
  padding: 5px 12px;
  background: var(--night);
}
.sb-empty { font-size: 12px; color: var(--mute); padding: 4px 0; }

/* ── Controls row ───────────────────────────────────────── */
.controls-row {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.section-eyebrow {
  font-size: 9px; letter-spacing: 0.32em;
  text-transform: uppercase; color: var(--mute);
}
.refresh-btn {
  background: none; border: 0.5px solid var(--line);
  color: var(--mute); font-family: Arial;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  padding: 6px 16px; border-radius: 20px; cursor: pointer;
  transition: all 0.15s;
}
.refresh-btn:hover { border-color: var(--white); color: var(--white); }

/* ── Submission cards ───────────────────────────────────── */
.cards { display: flex; flex-direction: column; gap: 0; }
.card {
  padding: 28px 0;
  border-top: 0.5px solid var(--line);
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 32px;
}
@media (max-width: 600px) {
  .card { grid-template-columns: 1fr; gap: 16px; }
}
.card:last-child { border-bottom: 0.5px solid var(--line); }
.card-name {
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--white); margin-bottom: 6px;
}
.card-time { font-size: 10px; color: var(--mute); }
.card-body { display: flex; flex-direction: column; gap: 16px; }
.card-field { display: grid; grid-template-columns: 80px 1fr; gap: 12px; align-items: start; }
.card-field-label {
  font-size: 8px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--mute);
  padding-top: 3px;
}
.card-field-val {
  font-size: 14px; color: var(--muted); line-height: 1.65;
}
.card-kakao { font-size: 10px; color: var(--mute); letter-spacing: 0.08em; }

/* ── Structured prepare display ─────────────────────────── */
.card-prepare { display: flex; flex-direction: column; gap: 6px; }
.card-prepare-result {
  font-size: 9px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--white);
  margin-bottom: 4px;
}
.card-prepare-row { display: grid; grid-template-columns: 28px 1fr; gap: 8px; }
.card-prepare-num {
  font-size: 9px; color: var(--mute);
  letter-spacing: 0.16em; padding-top: 2px;
}
.card-prepare-val { font-size: 13px; color: var(--muted); line-height: 1.55; }

/* ── Empty / Loading ────────────────────────────────────── */
.state-msg {
  padding: 60px 0;
  font-size: 13px; color: var(--mute);
  letter-spacing: 0.06em;
}
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 1.5px solid var(--line); border-top-color: var(--muted);
  border-radius: 50%; animation: spin 0.7s linear infinite;
  margin-right: 10px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<nav id="topnav">
  <span class="brand">러너스 LRS</span>
  <div class="nav-links">
    <a href="unit1.html" class="nav-link">← Unit 1</a>
    <a href="unit2.html" class="nav-link">Unit 2 →</a>
  </div>
</nav>

<div class="main">
  <span class="page-eyebrow">숙제 결과 확인 &nbsp;·&nbsp; 강원 U-18 영어 인터뷰 수업</span>
  <h1 class="page-title">HOMEWORK<br>RECORDS</h1>
  <div class="hl"></div>

  <!-- Unit 탭 -->
  <div class="unit-tabs" id="unit-tabs">
    <div class="unit-tab active" data-unit="unit1" onclick="selectUnit('unit1', this)">Unit 1</div>
    <div class="unit-tab" data-unit="unit2" onclick="selectUnit('unit2', this)">Unit 2</div>
    <div class="unit-tab" data-unit="unit3" onclick="selectUnit('unit3', this)">Unit 3</div>
    <div class="unit-tab" data-unit="unit4" onclick="selectUnit('unit4', this)">Unit 4</div>
    <div class="unit-tab" data-unit="unit5" onclick="selectUnit('unit5', this)">Unit 5</div>
    <div class="unit-tab" data-unit="unit6" onclick="selectUnit('unit6', this)">Unit 6</div>
  </div>

  <!-- 선수 기록표 (Scoreboard) -->
  <div class="scoreboard" id="scoreboard">
    <div class="sb-inner">
      <div class="sb-unit-row">
        <span class="sb-unit-tag" id="sb-unit-tag">UNIT 1</span>
        <span class="sb-unit-sub" id="sb-unit-sub">Self-Introduction &amp; Joining the Team</span>
      </div>
      <div class="sb-stats">
        <div class="sb-stat">
          <div class="sb-stat-num" id="stat-count">—</div>
          <div class="sb-stat-label">제출 완료</div>
        </div>
        <div class="sb-stat">
          <div class="sb-stat-num sb-stat-num-sm" id="stat-latest">—</div>
          <div class="sb-stat-label">최근 제출</div>
        </div>
      </div>
      <div class="sb-hl"></div>
      <div class="sb-roster-label">SUBMITTED ROSTER</div>
      <div class="sb-roster" id="sb-roster">
        <span class="sb-empty">불러오는 중…</span>
      </div>
    </div>
  </div>

  <!-- 상세 결과 헤더 + 새로고침 -->
  <div class="controls-row">
    <span class="section-eyebrow" id="detail-label">개별 결과</span>
    <button class="refresh-btn" onclick="loadSubmissions()">↻ 새로고침</button>
  </div>

  <!-- 카드 목록 -->
  <div id="cards-area">
    <div class="state-msg"><span class="spinner"></span>불러오는 중…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL  = 'https://ualucbrrfvysmfytkdew.supabase.co';
const SB_ANON = 'sb_publishable_nmqBIh-y6etZMXmxrUxbqA_t5uIIIOp';
const sb = window.supabase.createClient(SB_URL, SB_ANON);

const UNIT_INFO = {
  unit1: { label: 'UNIT 1', sub: 'Self-Introduction &amp; Joining the Team' },
  unit2: { label: 'UNIT 2', sub: 'Post-Match Flash Interview' },
  unit3: { label: 'UNIT 3', sub: '—' },
  unit4: { label: 'UNIT 4', sub: '—' },
  unit5: { label: 'UNIT 5', sub: '—' },
  unit6: { label: 'UNIT 6', sub: '—' },
};

let currentUnit = 'unit1';

if (location.hash) {
  const h = location.hash.replace('#', '');
  if (UNIT_INFO[h]) currentUnit = h;
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.unit-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.unit === currentUnit);
  });
  loadSubmissions();
});

function selectUnit(unit, el) {
  currentUnit = unit;
  document.querySelectorAll('.unit-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  location.hash = unit;
  loadSubmissions();
}

async function loadSubmissions() {
  const area = document.getElementById('cards-area');
  area.innerHTML = '<div class="state-msg"><span class="spinner"></span>불러오는 중…</div>';
  document.getElementById('stat-count').textContent = '—';
  document.getElementById('stat-latest').textContent = '—';
  document.getElementById('sb-roster').innerHTML = '<span class="sb-empty">불러오는 중…</span>';

  const info = UNIT_INFO[currentUnit] || { label: currentUnit.toUpperCase(), sub: '—' };
  document.getElementById('sb-unit-tag').textContent = info.label;
  document.getElementById('sb-unit-sub').innerHTML = info.sub;

  const { data, error } = await sb
    .from('b2b_homework_submissions')
    .select('student_name, rewatch_answer, prepare_answer, submitted_at')
    .eq('unit', currentUnit)
    .order('submitted_at', { ascending: false });

  if (error) {
    area.innerHTML = `<div class="state-msg">오류: ${esc(error.message)}</div>`;
    document.getElementById('sb-roster').innerHTML = '<span class="sb-empty">—</span>';
    return;
  }

  // ── Scoreboard stats
  document.getElementById('stat-count').textContent = data.length;
  document.getElementById('stat-latest').textContent = data.length > 0
    ? fmtRelative(data[0].submitted_at) : '없음';
  document.getElementById('detail-label').textContent = `개별 결과 · ${data.length}건`;

  // ── Roster chips
  const rosterEl = document.getElementById('sb-roster');
  if (data.length === 0) {
    rosterEl.innerHTML = '<span class="sb-empty">아직 제출한 학생이 없습니다.</span>';
  } else {
    rosterEl.innerHTML = data.map(r =>
      `<span class="sb-chip">${esc(r.student_name)}</span>`
    ).join('');
  }

  // ── Cards
  if (data.length === 0) {
    area.innerHTML = '<div class="state-msg">아직 제출된 숙제가 없습니다.</div>';
    return;
  }

  area.innerHTML = '<div class="cards">' + data.map(r => `
    <div class="card">
      <div class="card-meta">
        <div class="card-name">${esc(r.student_name)}</div>
        <div class="card-time">${fmtDate(r.submitted_at)}</div>
      </div>
      <div class="card-body">
        ${r.rewatch_answer ? `
          <div class="card-field">
            <span class="card-field-label">Rewatch</span>
            <span class="card-field-val">${esc(r.rewatch_answer)}</span>
          </div>` : ''}
        ${r.prepare_answer ? `
          <div class="card-field">
            <span class="card-field-label">Prepare</span>
            <div>${renderPrepare(r.prepare_answer)}</div>
          </div>` : ''}
        <div class="card-field">
          <span class="card-field-label">Record</span>
          <span class="card-kakao">카카오톡으로 제출</span>
        </div>
      </div>
    </div>`).join('') + '</div>';
}

function renderPrepare(val) {
  if (!val) return '';
  try {
    const p = JSON.parse(val);
    if (typeof p !== 'object' || Array.isArray(p)) return `<span class="card-field-val">${esc(val)}</span>`;
    let html = '<div class="card-prepare">';
    if (p.result) {
      html += `<div class="card-prepare-result">${p.result === 'win' ? '승리 (WIN)' : '패배 (LOSE)'}</div>`;
    }
    ['01','02','03','04'].forEach(k => {
      if (p[k]) html += `<div class="card-prepare-row">
        <span class="card-prepare-num">${k}</span>
        <span class="card-prepare-val">${esc(p[k])}</span>
      </div>`;
    });
    html += '</div>';
    return html;
  } catch {
    return `<span class="card-field-val">${esc(val)}</span>`;
  }
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' }) + ' ' +
         d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

function fmtRelative(iso) {
  if (!iso) return '없음';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return '방금 전';
  if (m < 60) return m + '분 전';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '시간 전';
  return Math.floor(h / 24) + '일 전';
}
</script>
</body>
</html>
