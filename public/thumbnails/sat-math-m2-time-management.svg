<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- ===== ANALOG CLOCK (left-center) ===== -->
  <!-- Clock face -->
  <circle cx="390" cy="315" r="180" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- Inner ring -->
  <circle cx="390" cy="315" r="170" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Hour markers -->
  <!-- 12 -->
  <line x1="390" y1="148" x2="390" y2="170" stroke="#000000" stroke-width="5"/>
  <!-- 3 -->
  <line x1="557" y1="315" x2="535" y2="315" stroke="#000000" stroke-width="5"/>
  <!-- 6 -->
  <line x1="390" y1="482" x2="390" y2="460" stroke="#000000" stroke-width="5"/>
  <!-- 9 -->
  <line x1="223" y1="315" x2="245" y2="315" stroke="#000000" stroke-width="5"/>

  <!-- Minor hour markers -->
  <!-- 1 -->
  <line x1="474" y1="163" x2="466" y2="179" stroke="#000000" stroke-width="3"/>
  <!-- 2 -->
  <line x1="540" y1="231" x2="526" y2="239" stroke="#000000" stroke-width="3"/>
  <!-- 4 -->
  <line x1="540" y1="399" x2="526" y2="391" stroke="#000000" stroke-width="3"/>
  <!-- 5 -->
  <line x1="474" y1="467" x2="466" y2="451" stroke="#000000" stroke-width="3"/>
  <!-- 7 -->
  <line x1="306" y1="467" x2="314" y2="451" stroke="#000000" stroke-width="3"/>
  <!-- 8 -->
  <line x1="240" y1="399" x2="254" y2="391" stroke="#000000" stroke-width="3"/>
  <!-- 10 -->
  <line x1="240" y1="231" x2="254" y2="239" stroke="#000000" stroke-width="3"/>
  <!-- 11 -->
  <line x1="306" y1="163" x2="314" y2="179" stroke="#000000" stroke-width="3"/>

  <!-- Hour hand (pointing to ~10) -->
  <line x1="390" y1="315" x2="318" y2="222" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  <!-- Minute hand (pointing to ~2) -->
  <line x1="390" y1="315" x2="468" y2="176" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Second hand (thin, pointing to ~6) -->
  <line x1="390" y1="315" x2="390" y2="440" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Small tail of second hand -->
  <line x1="390" y1="315" x2="390" y2="280" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="390" cy="315" r="8" fill="#000000"/>
  <circle cx="390" cy="315" r="4" fill="#ffffff"/>

  <!-- ===== SCHEDULE / CHECKLIST (right-center) ===== -->
  <!-- Clipboard outline -->
  <rect x="640" y="130" width="330" height="380" rx="8" fill="none" stroke="#000000" stroke-width="4.5"/>

  <!-- Clipboard top clip -->
  <rect x="745" y="115" width="120" height="36" rx="6" fill="none" stroke="#000000" stroke-width="4.5"/>
  <rect x="775" y="108" width="60" height="20" rx="4" fill="none" stroke="#000000" stroke-width="3.5"/>

  <!-- Horizontal divider under header -->
  <line x1="640" y1="190" x2="970" y2="190" stroke="#000000" stroke-width="3"/>

  <!-- Header area text lines (title) -->
  <line x1="680" y1="210" x2="930" y2="210" stroke="#000000" stroke-width="4"/>
  <line x1="680" y1="228" x2="860" y2="228" stroke="#000000" stroke-width="2.5"/>

  <!-- Row 1 — checked -->
  <!-- Checkbox (checked) -->
  <rect x="672" y="262" width="28" height="28" rx="3" fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 678 276 L 684 284 L 696 266" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Line content -->
  <line x1="716" y1="272" x2="920" y2="272" stroke="#000000" stroke-width="3.5"/>
  <line x1="716" y1="286" x2="880" y2="286" stroke="#000000" stroke-width="2"/>

  <!-- Row 2 — checked -->
  <rect x="672" y="320" width="28" height="28" rx="3" fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 678 334 L 684 342 L 696 324" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="716" y1="330" x2="920" y2="330" stroke="#000000" stroke-width="3.5"/>
  <line x1="716" y1="344" x2="860" y2="344" stroke="#000000" stroke-width="2"/>

  <!-- Row 3 — unchecked, highlighted (important row) -->
  <rect x="672" y="378" width="28" height="28" rx="3" fill="none" stroke="#000000" stroke-width="3"/>
  <line x1="716" y1="388" x2="920" y2="388" stroke="#000000" stroke-width="4.5"/>
  <line x1="716" y1="402" x2="900" y2="402" stroke="#000000" stroke-width="2.5"/>

  <!-- Row 4 — unchecked -->
  <rect x="672" y="436" width="28" height="28" rx="3" fill="none" stroke="#000000" stroke-width="3"/>
  <line x1="716" y1="446" x2="920" y2="446" stroke="#000000" stroke-width="3.5"/>
  <line x1="716" y1="460" x2="840" y2="460" stroke="#000000" stroke-width="2"/>

  <!-- Row 5 — unchecked -->
  <rect x="672" y="468" width="28" height="28" rx="3" fill="none" stroke="#000000" stroke-width="3"/>
  <line x1="716" y1="478" x2="920" y2="478" stroke="#000000" stroke-width="3.5"/>
  <line x1="716" y1="492" x2="870" y2="492" stroke="#000000" stroke-width="2"/>

  <!-- ===== CONNECTING ARROW between clock and clipboard ===== -->
  <path d="M 575 315 Q 610 315 630 315" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="630,308 644,315 630,322" fill="#000000"/>

</svg>
