<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- ===== CLOCK WITH X (left) — "not about time" ===== -->
  <!-- Clock face -->
  <circle cx="370" cy="315" r="180" fill="none" stroke="#000000" stroke-width="5"/>
  <circle cx="370" cy="315" r="170" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Hour markers -->
  <line x1="370" y1="148" x2="370" y2="170" stroke="#000000" stroke-width="5"/>
  <line x1="537" y1="315" x2="515" y2="315" stroke="#000000" stroke-width="5"/>
  <line x1="370" y1="482" x2="370" y2="460" stroke="#000000" stroke-width="5"/>
  <line x1="203" y1="315" x2="225" y2="315" stroke="#000000" stroke-width="5"/>

  <!-- Minor hour markers -->
  <line x1="454" y1="163" x2="446" y2="179" stroke="#000000" stroke-width="3"/>
  <line x1="520" y1="231" x2="506" y2="239" stroke="#000000" stroke-width="3"/>
  <line x1="520" y1="399" x2="506" y2="391" stroke="#000000" stroke-width="3"/>
  <line x1="454" y1="467" x2="446" y2="451" stroke="#000000" stroke-width="3"/>
  <line x1="286" y1="467" x2="294" y2="451" stroke="#000000" stroke-width="3"/>
  <line x1="220" y1="399" x2="234" y2="391" stroke="#000000" stroke-width="3"/>
  <line x1="220" y1="231" x2="234" y2="239" stroke="#000000" stroke-width="3"/>
  <line x1="286" y1="163" x2="294" y2="179" stroke="#000000" stroke-width="3"/>

  <!-- Hour hand (~10) -->
  <line x1="370" y1="315" x2="298" y2="222" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  <!-- Minute hand (~2) -->
  <line x1="370" y1="315" x2="448" y2="176" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="370" cy="315" r="8" fill="#000000"/>
  <circle cx="370" cy="315" r="4" fill="#ffffff"/>

  <!-- Large X over the clock -->
  <line x1="245" y1="190" x2="495" y2="440" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
  <line x1="495" y1="190" x2="245" y2="440" stroke="#000000" stroke-width="9" stroke-linecap="round"/>

  <!-- ===== ARROW pointing right ===== -->
  <path d="M 565 315 Q 600 315 620 315" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="620,308 634,315 620,322" fill="#000000"/>

  <!-- ===== MAGNIFYING GLASS over document (right) — "real cause" ===== -->
  <!-- Document -->
  <rect x="660" y="130" width="300" height="380" rx="6" fill="none" stroke="#000000" stroke-width="4"/>
  <!-- Folded corner -->
  <polyline points="900,130 960,130 960,510 660,510 660,130" fill="none" stroke="none"/>
  <line x1="900" y1="130" x2="960" y2="130" stroke="none"/>
  <polygon points="900,130 960,170 900,170" fill="none" stroke="#000000" stroke-width="3"/>
  <line x1="900" y1="130" x2="900" y2="170" stroke="#000000" stroke-width="3"/>
  <line x1="900" y1="170" x2="960" y2="170" stroke="#000000" stroke-width="3"/>

  <!-- Document lines -->
  <line x1="695" y1="195" x2="895" y2="195" stroke="#000000" stroke-width="4"/>
  <line x1="695" y1="215" x2="860" y2="215" stroke="#000000" stroke-width="2.5"/>
  <line x1="695" y1="250" x2="895" y2="250" stroke="#000000" stroke-width="2.5"/>
  <line x1="695" y1="268" x2="870" y2="268" stroke="#000000" stroke-width="2.5"/>
  <line x1="695" y1="286" x2="895" y2="286" stroke="#000000" stroke-width="2.5"/>

  <!-- Highlighted region (the real cause) -->
  <rect x="688" y="318" width="212" height="52" rx="3" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="6,3"/>
  <line x1="695" y1="332" x2="890" y2="332" stroke="#000000" stroke-width="4"/>
  <line x1="695" y1="350" x2="840" y2="350" stroke="#000000" stroke-width="4"/>
  <line x1="695" y1="368" x2="870" y2="368" stroke="#000000" stroke-width="4"/>

  <line x1="695" y1="400" x2="895" y2="400" stroke="#000000" stroke-width="2.5"/>
  <line x1="695" y1="418" x2="860" y2="418" stroke="#000000" stroke-width="2.5"/>
  <line x1="695" y1="436" x2="895" y2="436" stroke="#000000" stroke-width="2.5"/>
  <line x1="695" y1="454" x2="800" y2="454" stroke="#000000" stroke-width="2.5"/>

  <!-- Magnifying glass -->
  <circle cx="952" cy="268" r="72" fill="none" stroke="#000000" stroke-width="6"/>
  <circle cx="952" cy="268" r="58" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- Handle -->
  <line x1="1005" y1="321" x2="1065" y2="390" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
  <!-- Magnifying glass focus lines (pointing to highlighted region) -->
  <line x1="900" y1="300" x2="870" y2="340" stroke="#000000" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>
</svg>
