<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레슨 피드백 · 러너스 LRS</title>
<meta property="og:title" content="레슨 피드백 · 러너스 LRS" />
<meta property="og:description" content="강원 U-18 영어 인터뷰 수업 · 레슨 피드백 포털" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --night:   #000000;
  --night-s: #0a0a0a;
  --night-2: #111111;
  --white:   #ffffff;
  --mute:    #5a5a5f;
  --muted:   #8a8a8f;
  --line:    #2a2a2f;
  --max:     1080px;
  --pad:     clamp(24px, 5vw, 80px);
  --accent:  #4f9fff;
}

html { scroll-behavior: smooth; }
body {
  background: var(--night);
  color: var(--white);
  font-family: Arial, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ── Nav ────────────────────────────────────────────────── */
#topnav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 0.5px solid var(--line);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 var(--pad); height: 48px;
}
.brand { font-size: 11px; font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; }
.nav-links { display: flex; gap: 20px; align-items: center; }
.nav-link {
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--mute); text-decoration: none; transition: color 0.15s;
}
.nav-link:hover { color: var(--white); }

/* ── Layout ─────────────────────────────────────────────── */
.main {
  max-width: var(--max);
  margin: 0 auto;
  padding: 64px var(--pad) 120px;
}

/* ── Page header ─────────────────────────────────────────── */
.page-eyebrow {
  font-size: 9px; letter-spacing: 0.36em;
  text-transform: uppercase; color: var(--mute);
  display: block; margin-bottom: 20px;
}
.page-title {
  font-size: clamp(32px, 5vw, 56px);
  font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; line-height: 0.94;
  margin-bottom: 12px;
}
.page-desc {
  font-size: 13px; color: var(--muted); line-height: 1.6;
  max-width: 560px; margin-bottom: 40px;
}
.hl { height: 0.5px; background: var(--line); margin-bottom: 40px; }

/* ── Section headers ─────────────────────────────────────── */
.section-block { margin-bottom: 64px; }
.section-eyebrow {
  font-size: 9px; letter-spacing: 0.36em;
  text-transform: uppercase; color: var(--mute);
  display: block; margin-bottom: 16px;
}
.section-title {
  font-size: clamp(22px, 3vw, 34px);
  font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; margin-bottom: 32px;
}

/* ── Form ────────────────────────────────────────────────── */
.form-group { margin-bottom: 28px; }
.form-label {
  display: block;
  font-size: 9px; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--mute);
  margin-bottom: 10px;
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

input[type="text"],
input[type="date"],
input[type="number"],
textarea,
select {
  width: 100%; background: var(--night-2);
  border: 0.5px solid var(--line);
  color: var(--white); font-family: Arial, sans-serif; font-size: 14px;
  padding: 12px 14px; outline: none;
  transition: border-color 0.15s;
  appearance: none; -webkit-appearance: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--muted); }
select { cursor: pointer; background-image: none; }
textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
textarea.tall { min-height: 200px; }

/* ── Student notes ───────────────────────────────────────── */
.student-rows { display: flex; flex-direction: column; gap: 12px; }
.student-row {
  border: 0.5px solid var(--line);
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  background: var(--night-s);
}
.student-row-header {
  display: flex; align-items: center; gap: 12px;
}
.student-row-header input { flex: 1; }
.remove-btn {
  background: none; border: 0.5px solid var(--line);
  color: var(--mute); cursor: pointer; font-family: Arial;
  font-size: 11px; padding: 8px 14px; letter-spacing: 0.1em;
  transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
}
.remove-btn:hover { border-color: #ff4444; color: #ff4444; }

.add-student-btn {
  background: none; border: 0.5px dashed var(--line);
  color: var(--mute); cursor: pointer; font-family: Arial;
  font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase;
  padding: 12px 20px; width: 100%;
  transition: all 0.15s; margin-top: 4px;
}
.add-student-btn:hover { border-color: var(--muted); color: var(--white); }

/* ── PIN input ───────────────────────────────────────────── */
.pin-wrap {
  display: flex; gap: 12px; align-items: stretch;
  max-width: 360px;
}
.pin-wrap input {
  letter-spacing: 0.4em; font-size: 20px; font-weight: 700;
  text-align: center; max-width: 200px;
}
.pin-hint {
  font-size: 11px; color: var(--mute); margin-top: 8px;
  letter-spacing: 0.06em;
}

/* ── Buttons ─────────────────────────────────────────────── */
.btn-primary {
  display: inline-block;
  background: var(--white); color: var(--night);
  font-family: Arial; font-size: 10px;
  font-weight: 700; letter-spacing: 0.28em;
  text-transform: uppercase; padding: 14px 32px;
  border: none; cursor: pointer; transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.85; }
.btn-primary:disabled { opacity: 0.35; cursor: default; }
.btn-outline {
  display: inline-block;
  background: none; color: var(--white);
  font-family: Arial; font-size: 10px;
  font-weight: 700; letter-spacing: 0.28em;
  text-transform: uppercase; padding: 13px 28px;
  border: 0.5px solid var(--line); cursor: pointer; transition: all 0.15s;
}
.btn-outline:hover { border-color: var(--white); }

/* ── State messages ──────────────────────────────────────── */
.msg {
  font-size: 12px; letter-spacing: 0.1em;
  padding: 12px 0; display: none;
}
.msg.success { color: #4caf80; display: block; }
.msg.error   { color: #ff6b6b; display: block; }

/* ── Page divider ────────────────────────────────────────── */
.page-divider {
  height: 0.5px; background: var(--line);
  margin: 64px 0;
  position: relative;
}
.page-divider-label {
  position: absolute; top: -10px; left: 50%;
  transform: translateX(-50%);
  background: var(--night);
  padding: 0 16px;
  font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--mute);
}

/* ── Feedback viewer ─────────────────────────────────────── */
.pin-viewer { max-width: 480px; }
.pin-viewer-row { display: flex; gap: 12px; align-items: stretch; }
.pin-viewer-row input {
  letter-spacing: 0.4em; font-size: 20px; font-weight: 700;
  text-align: center; max-width: 200px;
}

/* ── Feedback display card ───────────────────────────────── */
.fb-card {
  border: 0.5px solid var(--line);
  display: none;
  margin-top: 40px;
}
.fb-card.visible { display: block; }
.fb-card-header {
  padding: 20px 24px 18px;
  border-bottom: 0.5px solid var(--line);
  background: var(--night-s);
}
.fb-card-eyebrow {
  font-size: 8px; letter-spacing: 0.32em;
  text-transform: uppercase; color: var(--mute);
  margin-bottom: 6px;
}
.fb-card-title {
  font-size: 18px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.fb-card-meta {
  font-size: 11px; color: var(--muted);
  margin-top: 6px; letter-spacing: 0.06em;
}
.fb-card-body { padding: 28px 24px; display: flex; flex-direction: column; gap: 32px; }
.fb-section { display: flex; flex-direction: column; gap: 12px; }
.fb-section-label {
  font-size: 8px; letter-spacing: 0.3em;
  text-transform: uppercase; color: var(--mute);
  padding-bottom: 10px;
  border-bottom: 0.5px solid var(--line);
}
.fb-section-text {
  font-size: 14px; color: var(--muted);
  line-height: 1.7; white-space: pre-wrap;
}
.fb-student-list { display: flex; flex-direction: column; gap: 16px; }
.fb-student-item {
  border-left: 2px solid var(--line);
  padding-left: 16px;
}
.fb-student-name {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--white); margin-bottom: 6px;
}
.fb-student-note {
  font-size: 13px; color: var(--muted);
  line-height: 1.65; white-space: pre-wrap;
}
</style>
</head>
<body>

<nav id="topnav">
  <span class="brand">러너스 LRS</span>
  <div class="nav-links">
    <a href="unit1.html" class="nav-link">Unit 1 수업</a>
    <a href="unit2.html" class="nav-link">Unit 2 수업</a>
    <a href="homework.html" class="nav-link">숙제 결과 확인</a>
  </div>
</nav>

<div class="main">

  <span class="page-eyebrow">레슨 피드백 &nbsp;·&nbsp; 강원 U-18 영어 인터뷰 수업</span>
  <h1 class="page-title">Lesson Feedback</h1>
  <p class="page-desc">수업 후 강사가 피드백을 작성하면, 구단과 학부모가 6자리 비밀번호로 확인할 수 있습니다.</p>
  <div class="hl"></div>

  <!-- ── Section 1: Instructor Write ────────────────────── -->
  <div class="section-block" id="write-section">
    <span class="section-eyebrow">강사 전용</span>
    <h2 class="section-title">피드백 작성</h2>

    <div class="form-row" style="margin-bottom: 28px;">
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label" for="sel-unit">유닛</label>
        <select id="sel-unit" onchange="onUnitChange()">
          <option value="">유닛 선택</option>
          <option value="unit1">Unit 1 — Self-Introduction & Joining the Team</option>
          <option value="unit2">Unit 2 — Win / Lose Interview</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label" for="inp-date">수업 날짜</label>
        <input type="date" id="inp-date" />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="inp-content">이번 수업 내용 <span style="color:var(--line);font-size:8px;">(유닛 선택 시 자동 입력 · 수정 가능)</span></label>
      <textarea id="inp-content" class="tall" placeholder="유닛을 먼저 선택하면 자동으로 내용이 채워집니다."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">학생별 메모 <span style="color:var(--line);font-size:8px;">(구단에게 전달할 내용)</span></label>
      <div class="student-rows" id="student-rows"></div>
      <button class="add-student-btn" onclick="addStudentRow()">+ 학생 추가</button>
    </div>

    <div class="form-group">
      <label class="form-label" for="inp-hw">숙제</label>
      <textarea id="inp-hw" placeholder="이번 수업의 숙제 안내를 입력하세요."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label" for="inp-pin">비밀번호 설정 <span style="color:var(--line);font-size:8px;">(6자리 숫자 · 구단/학부모 공유용)</span></label>
      <div class="pin-wrap">
        <input type="number" id="inp-pin" placeholder="000000" maxlength="6"
               oninput="if(this.value.length>6)this.value=this.value.slice(0,6)"
               style="max-width:200px;" />
      </div>
      <p class="pin-hint">이 번호를 구단에 전달하면, 구단과 학부모가 피드백을 열람할 수 있습니다.</p>
    </div>

    <button class="btn-primary" onclick="submitFeedback()" id="submit-btn">저장하기</button>
    <div class="msg" id="write-msg"></div>
  </div>

  <!-- ── Divider ─────────────────────────────────────────── -->
  <div class="page-divider">
    <span class="page-divider-label">피드백 열람</span>
  </div>

  <!-- ── Section 2: Club / Parent View ──────────────────── -->
  <div class="section-block" id="view-section">
    <span class="section-eyebrow">구단 · 학부모</span>
    <h2 class="section-title">피드백 확인</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:28px;">강사에게 받은 6자리 비밀번호를 입력하세요.</p>

    <div class="pin-viewer">
      <div class="pin-viewer-row">
        <input type="number" id="view-pin" placeholder="000000" maxlength="6"
               oninput="if(this.value.length>6)this.value=this.value.slice(0,6)"
               onkeydown="if(event.key==='Enter')viewFeedback()" />
        <button class="btn-primary" onclick="viewFeedback()">확인하기</button>
      </div>
      <div class="msg" id="view-msg"></div>
    </div>

    <!-- Feedback display card -->
    <div class="fb-card" id="fb-card">
      <div class="fb-card-header">
        <div class="fb-card-eyebrow" id="fb-eyebrow">레슨 피드백</div>
        <div class="fb-card-title" id="fb-title">—</div>
        <div class="fb-card-meta" id="fb-meta">—</div>
      </div>
      <div class="fb-card-body">

        <div class="fb-section" id="fb-sec-content">
          <div class="fb-section-label">이번 수업 내용</div>
          <div class="fb-section-text" id="fb-content-text"></div>
        </div>

        <div class="fb-section" id="fb-sec-students" style="display:none;">
          <div class="fb-section-label">학생별 메모</div>
          <div class="fb-student-list" id="fb-student-list"></div>
        </div>

        <div class="fb-section" id="fb-sec-hw" style="display:none;">
          <div class="fb-section-label">숙제</div>
          <div class="fb-section-text" id="fb-hw-text"></div>
        </div>

      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL  = 'https://ualucbrrfvysmfytkdew.supabase.co';
const SB_ANON = 'sb_publishable_nmqBIh-y6etZMXmxrUxbqA_t5uIIIOp';
const sb = supabase.createClient(SB_URL, SB_ANON);

/* ── Unit content templates ──────────────────────────────── */
const UNIT_TEMPLATES = {
  unit1: `Unit 1: Self-Introduction & Joining the Team

오늘 수업에서는 영어 인터뷰에서 자기소개 및 팀 합류 인사를 자연스럽게 할 수 있도록 연습했습니다.

주요 학습 내용:
- REWATCH: Son Heung-min의 팀 합류 인터뷰 영상을 함께 분석했습니다.
- PREPARE: 빈칸 채우기를 통해 핵심 표현을 익혔습니다.
  01. I'm incredibly ___ to be joining ___
  02. I have come here to ___ and give everything for ___
  03. I can't wait to ___ with ___
  04. It's ___ to be part of ___`,

  unit2: `Unit 2: Win / Lose Interview

오늘 수업에서는 경기 결과에 따라 다른 톤과 표현으로 인터뷰하는 방법을 연습했습니다.

주요 학습 내용:
- WIN 인터뷰: Son Heung-min (Tottenham 4-0 Southampton 2021) 승리 후 인터뷰 분석
- LOSE 인터뷰: Bukayo Saka (Arsenal 0-1 Newcastle 2022) 패배 후 인터뷰 분석
- COMPARE: 승패 상황의 언어적 차이 비교 학습
  WIN: 감사 · 팀워크 강조 ("I'm so happy to score...")
  LOSE: 책임감 · 희망 유지 ("We are all incredibly disappointed...")`
};

const UNIT_LABELS = {
  unit1: 'Unit 1 — Self-Introduction & Joining the Team',
  unit2: 'Unit 2 — Win / Lose Interview'
};

/* ── Init ────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('inp-date').value = new Date().toISOString().slice(0, 10);
  addStudentRow();
});

/* ── Unit change ─────────────────────────────────────────── */
function onUnitChange() {
  const unit = document.getElementById('sel-unit').value;
  const ta   = document.getElementById('inp-content');
  if (unit && UNIT_TEMPLATES[unit]) {
    ta.value = UNIT_TEMPLATES[unit];
  } else {
    ta.value = '';
  }
}

/* ── Student rows ────────────────────────────────────────── */
let studentCount = 0;

function addStudentRow() {
  studentCount++;
  const id  = `sr-${studentCount}`;
  const div = document.createElement('div');
  div.className = 'student-row';
  div.id = id;
  div.innerHTML = `
    <div class="student-row-header">
      <input type="text" placeholder="학생 이름" class="sr-name" />
      <button class="remove-btn" onclick="removeStudentRow('${id}')">삭제</button>
    </div>
    <textarea placeholder="이 학생에 대해 구단에게 전달하고 싶은 내용을 적어주세요." class="sr-note" style="min-height:80px;"></textarea>
  `;
  document.getElementById('student-rows').appendChild(div);
}

function removeStudentRow(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function collectStudentNotes() {
  const rows = document.querySelectorAll('.student-row');
  const notes = [];
  rows.forEach(row => {
    const name = row.querySelector('.sr-name').value.trim();
    const note = row.querySelector('.sr-note').value.trim();
    if (name || note) notes.push({ name, note });
  });
  return notes;
}

/* ── Submit feedback ─────────────────────────────────────── */
async function submitFeedback() {
  const unit    = document.getElementById('sel-unit').value.trim();
  const date    = document.getElementById('inp-date').value.trim();
  const content = document.getElementById('inp-content').value.trim();
  const hw      = document.getElementById('inp-hw').value.trim();
  const pin     = document.getElementById('inp-pin').value.trim();
  const msgEl   = document.getElementById('write-msg');

  msgEl.className = 'msg';
  msgEl.textContent = '';

  if (!unit)               { showMsg(msgEl, 'error', '유닛을 선택해주세요.'); return; }
  if (!date)               { showMsg(msgEl, 'error', '수업 날짜를 입력해주세요.'); return; }
  if (!content)            { showMsg(msgEl, 'error', '수업 내용을 입력해주세요.'); return; }
  if (!/^\d{6}$/.test(pin)) { showMsg(msgEl, 'error', '비밀번호는 6자리 숫자여야 합니다.'); return; }

  const studentNotes = collectStudentNotes();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '저장 중...';

  const { error } = await sb.from('b2b_lesson_feedback').insert({
    unit,
    lesson_date:    date,
    lesson_content: content,
    student_notes:  studentNotes.length ? studentNotes : null,
    homework:       hw || null,
    pin
  });

  btn.disabled = false;
  btn.textContent = '저장하기';

  if (error) {
    showMsg(msgEl, 'error', '저장 실패: ' + error.message);
  } else {
    showMsg(msgEl, 'success', '피드백이 저장되었습니다. 비밀번호 ' + pin + ' 을 구단에 전달해주세요.');
    document.getElementById('sel-unit').value = '';
    document.getElementById('inp-content').value = '';
    document.getElementById('inp-hw').value = '';
    document.getElementById('inp-pin').value = '';
    document.getElementById('student-rows').innerHTML = '';
    studentCount = 0;
    addStudentRow();
    document.getElementById('inp-date').value = new Date().toISOString().slice(0, 10);
  }
}

/* ── View feedback by PIN ────────────────────────────────── */
async function viewFeedback() {
  const pin   = document.getElementById('view-pin').value.trim();
  const msgEl = document.getElementById('view-msg');

  msgEl.className = 'msg';
  msgEl.textContent = '';
  document.getElementById('fb-card').classList.remove('visible');

  if (!/^\d{6}$/.test(pin)) {
    showMsg(msgEl, 'error', '6자리 숫자 비밀번호를 입력해주세요.');
    return;
  }

  const { data, error } = await sb
    .from('b2b_lesson_feedback')
    .select('*')
    .eq('pin', pin)
    .order('created_at', { ascending: false })
    .limit(1);

  if (error || !data || !data.length) {
    showMsg(msgEl, 'error', '일치하는 피드백을 찾을 수 없습니다. 비밀번호를 확인해주세요.');
    return;
  }

  renderFeedback(data[0]);
}

function renderFeedback(fb) {
  const unitLabel = UNIT_LABELS[fb.unit] || fb.unit || '—';
  const dateStr   = fb.lesson_date
    ? new Date(fb.lesson_date + 'T00:00:00').toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })
    : '—';

  document.getElementById('fb-eyebrow').textContent = '레슨 피드백';
  document.getElementById('fb-title').textContent   = unitLabel;
  document.getElementById('fb-meta').textContent    = dateStr;

  // Lesson content
  const contentEl = document.getElementById('fb-content-text');
  contentEl.textContent = fb.lesson_content || '—';
  document.getElementById('fb-sec-content').style.display = 'flex';

  // Student notes
  const studentList = document.getElementById('fb-student-list');
  const studentSec  = document.getElementById('fb-sec-students');
  studentList.innerHTML = '';

  const notes = fb.student_notes;
  if (notes && Array.isArray(notes) && notes.length) {
    notes.forEach(s => {
      const item = document.createElement('div');
      item.className = 'fb-student-item';
      item.innerHTML = `
        <div class="fb-student-name">${escHtml(s.name || '—')}</div>
        <div class="fb-student-note">${escHtml(s.note || '—')}</div>
      `;
      studentList.appendChild(item);
    });
    studentSec.style.display = 'flex';
  } else {
    studentSec.style.display = 'none';
  }

  // Homework
  const hwSec  = document.getElementById('fb-sec-hw');
  const hwText = document.getElementById('fb-hw-text');
  if (fb.homework) {
    hwText.textContent = fb.homework;
    hwSec.style.display = 'flex';
  } else {
    hwSec.style.display = 'none';
  }

  document.getElementById('fb-card').classList.add('visible');
  document.getElementById('fb-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ── Helpers ─────────────────────────────────────────────── */
function showMsg(el, type, text) {
  el.className = 'msg ' + type;
  el.textContent = text;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
