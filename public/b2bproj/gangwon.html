<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강원 FC × Runners LRS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --night:       #000000;
  --night-soft:  #0a0a0a;
  --light:       #ffffff;
  --hairline:    #3a3a3f;
  --mute:        #5a5a5f;
  --on-mute:     #f0f0fa;
  --attend:      #15803d;
  --absent:      #b91c1c;
}

html { scroll-behavior: smooth; }
body {
  background: var(--night);
  color: var(--light);
  font-family: 'Inter', 'Arial Narrow', Arial, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Fixed nav overlay ───────────────────────────────────── */
#topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--night);
  border-bottom: 1px solid var(--hairline);
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 clamp(20px, 5vw, 48px);
}
.brand {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.35em; text-transform: uppercase;
  color: var(--light);
}
.nav-btn {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--light); background: none;
  border: 1px solid var(--hairline);
  border-radius: 32px;
  padding: 8px 18px;
  cursor: pointer; transition: border-color 0.15s;
  display: none;
}
.nav-btn:hover { border-color: var(--light); }
.nav-btn.visible { display: block; }

/* ── Hero ────────────────────────────────────────────────── */
.hero {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: calc(56px + 48px) clamp(20px, 5vw, 48px) 80px;
  text-align: center;
  position: relative;
}
.hero::before {
  content: '';
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 40% at 50% 30%, rgba(255,255,255,0.03) 0%, transparent 70%);
}
.eyebrow {
  display: flex; align-items: center; justify-content: center;
  gap: 16px; margin-bottom: 24px;
}
.eyebrow .rule { height: 1px; width: 40px; background: var(--hairline); }
.eyebrow-text {
  font-size: 11px; font-weight: 400;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--mute);
}
.hero-title {
  font-size: clamp(36px, 7vw, 64px);
  font-weight: 800;
  letter-spacing: 0.06em;
  line-height: 0.95;
  text-transform: uppercase;
  color: var(--light);
  margin-bottom: 16px;
}
.hero-sub {
  font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--mute); margin-bottom: 48px;
}

/* ── Auth card (on dark canvas) ──────────────────────────── */
.auth-card {
  width: 100%; max-width: 380px;
  border: 1px solid var(--hairline);
  background: var(--night-soft);
  padding: 36px 32px;
  text-align: left;
  position: relative;
}
.card-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--mute); margin-bottom: 8px;
}
.card-title {
  font-size: 18px; font-weight: 700;
  letter-spacing: 0.03em;
  color: var(--light); margin-bottom: 6px;
}
.card-desc {
  font-size: 12px; letter-spacing: 0.03em;
  color: var(--mute); margin-bottom: 28px;
  line-height: 1.6;
}

/* ── PIN boxes ───────────────────────────────────────────── */
.pin-boxes { display: flex; gap: 8px; margin-bottom: 20px; }
.pin-boxes input {
  width: 48px; height: 56px;
  background: transparent;
  border: 1px solid var(--hairline);
  color: var(--light);
  font-size: 22px; font-weight: 700; text-align: center;
  border-radius: 4px;
  outline: none;
  caret-color: transparent;
  transition: border-color 0.15s;
  -webkit-appearance: none;
  font-family: inherit;
}
.pin-boxes input:focus { border-color: rgba(255,255,255,0.5); }
.pin-boxes input.filled { border-color: var(--light); }

/* ── Ghost pill button ───────────────────────────────────── */
.btn-ghost-pill {
  width: 100%; padding: 16px 24px;
  background: transparent;
  border: 1px solid var(--light);
  border-radius: 32px;
  color: var(--light);
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  cursor: pointer;
  transition: background 0.15s;
  font-family: inherit;
}
.btn-ghost-pill:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
.btn-ghost-pill:disabled { opacity: 0.3; cursor: default; }

.btn-text-ghost {
  background: none; border: none;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--mute); cursor: pointer;
  font-family: inherit;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 0; margin-top: 20px;
  transition: color 0.15s;
}
.btn-text-ghost:hover { color: var(--light); }

/* ── Status messages ─────────────────────────────────────── */
.msg { font-size: 11px; letter-spacing: 0.04em; min-height: 16px; margin-bottom: 14px; }
.msg.error { color: #f87171; }
.msg.success { color: #4ade80; }

/* ── Spinner ─────────────────────────────────────────────── */
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 1.5px solid rgba(255,255,255,0.2); border-top-color: #fff;
  border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Feedback section ────────────────────────────────────── */
#feedback-section {
  min-height: 100vh;
  padding: calc(56px + 40px) clamp(20px, 5vw, 48px) 80px;
  max-width: 760px; margin: 0 auto;
}
.fb-page-header {
  margin-bottom: 40px;
  border-bottom: 1px solid var(--hairline);
  padding-bottom: 28px;
}
.fb-page-eyebrow {
  font-size: 10px; font-weight: 400;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--mute); margin-bottom: 10px;
}
.fb-page-title {
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 800; letter-spacing: 0.04em;
  text-transform: uppercase; line-height: 0.95;
  color: var(--light);
}

/* ── Feedback items ──────────────────────────────────────── */
.fb-item {
  border: 1px solid var(--hairline);
  background: var(--night-soft);
  margin-bottom: 8px;
}
.fb-item-header {
  padding: 22px 24px; cursor: pointer;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  transition: background 0.1s;
}
.fb-item-header:hover { background: rgba(255,255,255,0.025); }
.fb-meta { flex: 1; min-width: 0; }

/* date + time row */
.fb-top-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; flex-wrap: wrap; }
.fb-date { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--on-mute); }
.fb-time-range { font-size: 11px; letter-spacing: 0.06em; color: var(--mute); }
.fb-duration { font-size: 10px; color: var(--hairline); letter-spacing: 0.06em; }

/* unit title */
.fb-unit-name { font-size: 16px; font-weight: 700; color: var(--light); letter-spacing: 0.01em; margin-bottom: 14px; }

/* attendance bar */
.fb-attend-row { display: flex; flex-direction: column; gap: 6px; }
.fb-bar-wrap { display: flex; align-items: center; gap: 10px; }
.fb-bar-track { flex: 1; height: 2px; background: var(--hairline); max-width: 160px; }
.fb-bar-fill { height: 100%; background: #4ade80; }
.fb-attend-stat { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--on-mute); white-space: nowrap; }
.fb-absent-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.fb-absent-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #f87171; margin-right: 2px; font-weight: 700; }
.fb-absent-name { font-size: 11px; color: #f87171; }

.fb-chevron { color: var(--hairline); transition: transform 0.2s; flex-shrink: 0; margin-top: 3px; }
.fb-item.open .fb-chevron { transform: rotate(90deg); color: var(--light); }
.fb-item-body { display: none; border-top: 1px solid var(--hairline); }
.fb-item.open .fb-item-body { display: block; }

.fb-section {
  padding: 20px 24px;
  border-bottom: 1px solid var(--hairline);
}
.fb-section:last-child { border-bottom: none; }
.fb-section-label {
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--mute); margin-bottom: 10px;
}
.fb-section-text {
  font-size: 14px; line-height: 1.75;
  color: var(--on-mute);
  white-space: pre-wrap; word-break: break-word;
}
.fb-section-text a { color: var(--light); text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }

/* ── Attendance chips (body — clickable) ─────────────────── */
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 12px; border-radius: 2px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; cursor: pointer;
  transition: opacity 0.15s;
}
.chip:hover { opacity: 0.7; }
.chip-attend { border: 1px solid rgba(74,222,128,0.4); color: #4ade80; background: rgba(74,222,128,0.08); }
.chip-absent { border: 1px solid rgba(248,113,113,0.4); color: #f87171; background: rgba(248,113,113,0.08); }

/* ── Student memos ───────────────────────────────────────── */
.student-item { margin-bottom: 14px; }
.student-item:last-child { margin-bottom: 0; }
.student-name {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--light); margin-bottom: 4px;
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  text-decoration-color: var(--hairline);
}
.student-name:hover { text-decoration-color: var(--light); }
.student-note { font-size: 13px; color: var(--on-mute); line-height: 1.6; }

/* ── Student history modal ───────────────────────────────── */
#student-modal {
  display: none; position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.88);
  align-items: center; justify-content: center;
  padding: 20px;
}
#student-modal.open { display: flex; }
.modal-card {
  background: var(--night-soft);
  border: 1px solid var(--hairline);
  width: 100%; max-width: 520px;
  max-height: 82vh; overflow-y: auto;
}
.modal-hd {
  padding: 24px 28px;
  border-bottom: 1px solid var(--hairline);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  position: sticky; top: 0; background: var(--night-soft); z-index: 1;
}
.modal-student-name {
  font-size: 22px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--light); margin-bottom: 4px;
}
.modal-attend-rate { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
.modal-rate-num { color: #4ade80; font-weight: 700; }
.modal-close {
  background: none; border: 1px solid var(--hairline); color: var(--mute);
  border-radius: 2px; font-size: 16px; line-height: 1;
  cursor: pointer; padding: 4px 10px; transition: all 0.15s; flex-shrink: 0;
}
.modal-close:hover { border-color: var(--light); color: var(--light); }
.modal-session {
  padding: 18px 28px;
  border-bottom: 1px solid var(--hairline);
  display: flex; gap: 14px; align-items: flex-start;
}
.modal-session:last-child { border-bottom: none; }
.modal-status {
  width: 42px; flex-shrink: 0;
  font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; padding-top: 2px;
}
.modal-status.attend { color: #4ade80; }
.modal-status.absent { color: #f87171; }
.modal-session-info { flex: 1; }
.modal-session-date {
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--on-mute); margin-bottom: 2px;
}
.modal-session-unit { font-size: 11px; color: var(--mute); margin-bottom: 6px; letter-spacing: 0.04em; }
.modal-session-note { font-size: 13px; color: var(--on-mute); line-height: 1.65; }

/* ── Change PIN section ──────────────────────────────────── */
#change-pin-section {
  display: none;
  max-width: 760px; margin: 0 auto;
  padding: 0 clamp(20px, 5vw, 48px) 40px;
}
.change-pin-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--mute); margin-bottom: 24px;
  display: flex; align-items: center; gap: 14px;
}
.change-pin-label::after { content: ''; flex: 1; height: 1px; background: var(--hairline); }
.change-card {
  border: 1px solid var(--hairline);
  background: var(--night-soft);
  padding: 32px;
  max-width: 380px;
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL  = 'https://ualucbrrfvysmfytkdew.supabase.co';
const SB_ANON = 'sb_publishable_nmqBIh-y6etZMXmxrUxbqA_t5uIIIOp';
const sb = supabase.createClient(SB_URL, SB_ANON);
const CLUB_ID = 'gangwon';

const UNIT_LABELS = {
  unit1: 'Unit 1 — Self-Introduction & Joining the Team',
  unit2: 'Unit 2 — Win / Lose Interview'
};

/* ── PIN box helper ──────────────────────────────────────── */
function initPin(boxId, btnId, onSubmit) {
  const inputs = Array.from(document.querySelectorAll(`#${boxId} input`));
  const btn    = document.getElementById(btnId);
  const getVal = () => inputs.map(el => el.value).join('');
  const reset  = () => { inputs.forEach(el => { el.value = ''; el.classList.remove('filled'); }); btn.disabled = true; };

  inputs.forEach((input, i) => {
    input.addEventListener('input', () => {
      const d = input.value.replace(/\D/g, '').slice(-1);
      input.value = d;
      input.classList.toggle('filled', !!d);
      if (d && i < inputs.length - 1) inputs[i + 1].focus();
      btn.disabled = getVal().length < 6;
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !input.value && i > 0) {
        e.preventDefault();
        inputs[i - 1].value = ''; inputs[i - 1].classList.remove('filled'); inputs[i - 1].focus(); btn.disabled = true;
      } else if (e.key === 'Enter' && getVal().length === 6) onSubmit();
    });
    input.addEventListener('paste', e => {
      e.preventDefault();
      const digits = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
      inputs.forEach((el, j) => { el.value = digits[j] || ''; el.classList.toggle('filled', !!digits[j]); });
      btn.disabled = digits.length < 6;
      inputs[Math.min(digits.length, 5)].focus();
    });
    input.addEventListener('focus', () => input.select());
  });

  return { getVal, reset };
}

const setupPin = initPin('setup-boxes', 'setup-btn', doSetPin);
const loginPin = initPin('login-boxes', 'login-btn', doLogin);
const newPin   = initPin('new-pin-boxes', 'change-btn', doChangePin);

/* ── Init: PIN 존재 여부 확인 ────────────────────────────── */
async function checkSetup() {
  const { data } = await sb.from('b2b_club_pins').select('pin').eq('club_id', CLUB_ID).maybeSingle();
  if (data) {
    document.getElementById('login-section').style.display = 'block';
  } else {
    document.getElementById('setup-section').style.display = 'block';
  }
}
checkSetup();

/* ── Set PIN (최초) ──────────────────────────────────────── */
async function doSetPin() {
  const pin   = setupPin.getVal();
  const btn   = document.getElementById('setup-btn');
  const msgEl = document.getElementById('setup-msg');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const { error } = await sb.from('b2b_club_pins').insert({ club_id: CLUB_ID, pin });

  btn.innerHTML = '설정하기';
  if (error) {
    msgEl.className = 'msg error'; msgEl.textContent = '오류: ' + error.message;
    btn.disabled = false; return;
  }

  document.getElementById('hero-section').style.display = 'none';
  document.getElementById('feedback-section').style.display = 'block';
  document.getElementById('btn-change-pin').classList.add('visible');
  loadFeedback();
}

/* ── Login ───────────────────────────────────────────────── */
async function doLogin() {
  const pin   = loginPin.getVal();
  const btn   = document.getElementById('login-btn');
  const msgEl = document.getElementById('login-msg');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const { data, error } = await sb.from('b2b_club_pins').select('pin').eq('club_id', CLUB_ID).single();

  btn.innerHTML = '확인하기';

  if (error || !data) {
    msgEl.className = 'msg error'; msgEl.textContent = '오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
    btn.disabled = false; return;
  }
  if (data.pin !== pin) {
    msgEl.className = 'msg error'; msgEl.textContent = '비밀번호가 일치하지 않습니다.';
    loginPin.reset(); return;
  }

  document.getElementById('hero-section').style.display = 'none';
  document.getElementById('feedback-section').style.display = 'block';
  document.getElementById('btn-change-pin').classList.add('visible');
  loadFeedback();
}

let allFeedback = [];

/* ── Load feedback ───────────────────────────────────────── */
async function loadFeedback() {
  const list = document.getElementById('feedback-list');
  list.innerHTML = '<div style="color:var(--mute);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;padding:8px 0;">불러오는 중...</div>';

  const { data, error } = await sb
    .from('b2b_lesson_feedback').select('*')
    .eq('club_id', CLUB_ID)
    .order('lesson_date', { ascending: false });

  if (error || !data || !data.length) {
    list.innerHTML = '<div style="color:var(--mute);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;padding:8px 0;">등록된 피드백이 없습니다.</div>';
    return;
  }
  allFeedback = data;
  list.innerHTML = '';
  data.forEach(fb => list.appendChild(buildItem(fb)));
}

function calcDuration(s, e) {
  if (!s || !e) return null;
  const [sh, sm] = s.split(':').map(Number);
  const [eh, em] = e.split(':').map(Number);
  const diff = (eh * 60 + em) - (sh * 60 + sm);
  return diff > 0 ? `${diff}분` : null;
}

function buildItem(fb) {
  const unitLabel  = UNIT_LABELS[fb.unit] || fb.unit || '—';
  const dateStr    = fb.lesson_date
    ? new Date(fb.lesson_date + 'T00:00:00').toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' })
    : '—';
  const attendees  = Array.isArray(fb.attendees) ? fb.attendees : [];
  const absentees  = Array.isArray(fb.absentees) ? fb.absentees : [];
  const total      = attendees.length + absentees.length;
  const pct        = total > 0 ? Math.round(attendees.length / total * 100) : null;
  const dur        = calcDuration(fb.start_time, fb.end_time);

  /* ── Score card header ── */
  let timeHtml = '';
  if (fb.start_time) {
    timeHtml = `<span class="fb-time-range">${fb.start_time.slice(0,5)} – ${(fb.end_time||'').slice(0,5)}</span>`;
    if (dur) timeHtml += `<span class="fb-duration">(${dur})</span>`;
  }

  let attendHtml = '';
  if (total > 0) {
    const barW = pct ?? 0;
    attendHtml = `
      <div class="fb-attend-row">
        <div class="fb-bar-wrap">
          <div class="fb-bar-track"><div class="fb-bar-fill" style="width:${barW}%"></div></div>
          <span class="fb-attend-stat">출석 ${attendees.length}/${total}명 · ${pct}%</span>
        </div>
        ${absentees.length ? `<div class="fb-absent-row"><span class="fb-absent-label">결석</span>${absentees.map(n=>`<span class="fb-absent-name">${escHtml(n)}</span>`).join('<span style="color:var(--hairline);margin:0 1px">·</span>')}</div>` : ''}
      </div>`;
  }

  /* ── Collapsible body sections ── */
  const sections = [];

  if (attendees.length || absentees.length) {
    let html = '';
    if (attendees.length) html += `<div class="fb-section-label" style="margin-bottom:8px;">출석</div><div class="chip-group">${attendees.map(n => `<span class="chip chip-attend" onclick="openStudentModal('${escHtml(n)}')">✓ ${escHtml(n)}</span>`).join('')}</div>`;
    if (absentees.length) html += `${attendees.length ? '<div style="margin-top:12px;"></div>' : ''}<div class="fb-section-label" style="margin-bottom:8px;">결석</div><div class="chip-group">${absentees.map(n => `<span class="chip chip-absent" onclick="openStudentModal('${escHtml(n)}')">✗ ${escHtml(n)}</span>`).join('')}</div>`;
    sections.push(`<div class="fb-section">${html}</div>`);
  }

  if (fb.lesson_content) {
    sections.push(`<div class="fb-section"><div class="fb-section-label">수업 내용</div><div class="fb-section-text">${linkify(fb.lesson_content)}</div></div>`);
  }

  if (fb.student_notes && fb.student_notes.length) {
    const notes = fb.student_notes.map(s =>
      `<div class="student-item"><div class="student-name" onclick="openStudentModal('${escHtml(s.name||'')}')">${escHtml(s.name || '—')}</div><div class="student-note">${escHtml(s.note || '—')}</div></div>`
    ).join('');
    sections.push(`<div class="fb-section"><div class="fb-section-label">학생별 메모</div>${notes}</div>`);
  }

  if (fb.homework) {
    sections.push(`<div class="fb-section"><div class="fb-section-label">숙제</div><div class="fb-section-text">${linkify(fb.homework)}</div></div>`);
  }

  const item = document.createElement('div');
  item.className = 'fb-item';
  item.innerHTML = `
    <div class="fb-item-header" onclick="this.parentElement.classList.toggle('open')">
      <div class="fb-meta">
        <div class="fb-top-row">
          <span class="fb-date">${dateStr}</span>
          ${timeHtml}
        </div>
        <div class="fb-unit-name">${escHtml(unitLabel)}</div>
        ${attendHtml}
      </div>
      <svg class="fb-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="fb-item-body">${sections.join('')}</div>
  `;
  return item;
}

/* ── Student modal ───────────────────────────────────────── */
function openStudentModal(name) {
  if (!name) return;
  const sessions = allFeedback.filter(fb => {
    const att = Array.isArray(fb.attendees) ? fb.attendees : [];
    const abs = Array.isArray(fb.absentees) ? fb.absentees : [];
    return att.includes(name) || abs.includes(name);
  });
  if (!sessions.length) return;

  const totalSessions = sessions.length;
  const attendedCount = sessions.filter(fb => (fb.attendees||[]).includes(name)).length;
  const rate = Math.round(attendedCount / totalSessions * 100);

  document.getElementById('modal-name').textContent = name;
  document.getElementById('modal-rate').innerHTML =
    `출석 <span class="modal-rate-num">${rate}%</span> &nbsp;·&nbsp; ${attendedCount}/${totalSessions}회`;

  const body = sessions.map(fb => {
    const dateStr = fb.lesson_date
      ? new Date(fb.lesson_date + 'T00:00:00').toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' })
      : '—';
    const isAttend = (fb.attendees||[]).includes(name);
    const note     = (fb.student_notes||[]).find(s => s.name === name);
    const unitLabel = UNIT_LABELS[fb.unit] || fb.unit || '—';
    return `
      <div class="modal-session">
        <div class="modal-status ${isAttend ? 'attend' : 'absent'}">${isAttend ? '출석' : '결석'}</div>
        <div class="modal-session-info">
          <div class="modal-session-date">${dateStr}</div>
          <div class="modal-session-unit">${escHtml(unitLabel)}</div>
          ${note && note.note ? `<div class="modal-session-note">${escHtml(note.note)}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('student-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeStudentModal() {
  document.getElementById('student-modal').classList.remove('open');
  document.body.style.overflow = '';
}

/* ── Change PIN ──────────────────────────────────────────── */
function toggleChangePin() {
  const sec = document.getElementById('change-pin-section');
  sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
  if (sec.style.display === 'block') { newPin.reset(); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  document.getElementById('change-msg').textContent = '';
}

async function doChangePin() {
  const pin   = newPin.getVal();
  const btn   = document.getElementById('change-btn');
  const msgEl = document.getElementById('change-msg');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const { error } = await sb.from('b2b_club_pins')
    .update({ pin, updated_at: new Date().toISOString() }).eq('club_id', CLUB_ID);

  btn.innerHTML = '변경하기';
  if (error) { msgEl.className = 'msg error'; msgEl.textContent = '변경 실패: ' + error.message; btn.disabled = false; }
  else { msgEl.className = 'msg success'; msgEl.textContent = '비밀번호가 변경되었습니다.'; newPin.reset(); }
}

/* ── Logout ──────────────────────────────────────────────── */
function doLogout() {
  document.getElementById('feedback-section').style.display = 'none';
  document.getElementById('change-pin-section').style.display = 'none';
  document.getElementById('btn-change-pin').classList.remove('visible');
  document.getElementById('hero-section').style.display = 'flex';
  document.getElementById('login-msg').textContent = '';
  loginPin.reset();
  setupPin.reset();
}

/* ── Helpers ─────────────────────────────────────────────── */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function linkify(str) {
  return str.split(/(https?:\/\/[^\s]+)/g).map((p, i) =>
    i % 2 === 1
      ? `<a href="${p}" target="_blank" rel="noopener noreferrer">${escHtml(p)}</a>`
      : escHtml(p)
  ).join('');
}
</script>
