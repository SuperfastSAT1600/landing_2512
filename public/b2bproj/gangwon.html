<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강원 FC × Runners LRS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --night:       #000000;
  --night-soft:  #0a0a0a;
  --light:       #ffffff;
  --hairline:    #3a3a3f;
  --mute:        #5a5a5f;
  --on-mute:     #f0f0fa;
  --attend:      #15803d;
  --absent:      #b91c1c;
}

html { scroll-behavior: smooth; }
body {
  background: var(--night);
  color: var(--light);
  font-family: 'Inter', 'Arial Narrow', Arial, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Fixed nav overlay ───────────────────────────────────── */
#topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--night);
  border-bottom: 1px solid var(--hairline);
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 clamp(20px, 5vw, 48px);
}
.brand {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.35em; text-transform: uppercase;
  color: var(--light);
}
.nav-btn {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--light); background: none;
  border: 1px solid var(--hairline);
  border-radius: 32px;
  padding: 8px 18px;
  cursor: pointer; transition: border-color 0.15s;
  display: none;
}
.nav-btn:hover { border-color: var(--light); }
.nav-btn.visible { display: block; }

/* ── Hero ────────────────────────────────────────────────── */
.hero {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: calc(56px + 48px) clamp(20px, 5vw, 48px) 80px;
  text-align: center;
  position: relative;
}
.hero::before {
  content: '';
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 40% at 50% 30%, rgba(255,255,255,0.03) 0%, transparent 70%);
}
.eyebrow {
  display: flex; align-items: center; justify-content: center;
  gap: 16px; margin-bottom: 24px;
}
.eyebrow .rule { height: 1px; width: 40px; background: var(--hairline); }
.eyebrow-text {
  font-size: 11px; font-weight: 400;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--mute);
}
.hero-title {
  font-size: clamp(36px, 7vw, 64px);
  font-weight: 800;
  letter-spacing: 0.06em;
  line-height: 0.95;
  text-transform: uppercase;
  color: var(--light);
  margin-bottom: 16px;
}
.hero-sub {
  font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--mute); margin-bottom: 48px;
}

/* ── Auth card (on dark canvas) ──────────────────────────── */
.auth-card {
  width: 100%; max-width: 380px;
  border: 1px solid var(--hairline);
  background: var(--night-soft);
  padding: 36px 32px;
  text-align: left;
  position: relative;
}
.card-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--mute); margin-bottom: 8px;
}
.card-title {
  font-size: 18px; font-weight: 700;
  letter-spacing: 0.03em;
  color: var(--light); margin-bottom: 6px;
}
.card-desc {
  font-size: 12px; letter-spacing: 0.03em;
  color: var(--mute); margin-bottom: 28px;
  line-height: 1.6;
}

/* ── PIN boxes ───────────────────────────────────────────── */
.pin-boxes { display: flex; gap: 8px; margin-bottom: 20px; }
.pin-boxes input {
  width: 48px; height: 56px;
  background: transparent;
  border: 1px solid var(--hairline);
  color: var(--light);
  font-size: 22px; font-weight: 700; text-align: center;
  border-radius: 4px;
  outline: none;
  caret-color: transparent;
  transition: border-color 0.15s;
  -webkit-appearance: none;
  font-family: inherit;
}
.pin-boxes input:focus { border-color: rgba(255,255,255,0.5); }
.pin-boxes input.filled { border-color: var(--light); }

/* ── Ghost pill button ───────────────────────────────────── */
.btn-ghost-pill {
  width: 100%; padding: 16px 24px;
  background: transparent;
  border: 1px solid var(--light);
  border-radius: 32px;
  color: var(--light);
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  cursor: pointer;
  transition: background 0.15s;
  font-family: inherit;
}
.btn-ghost-pill:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
.btn-ghost-pill:disabled { opacity: 0.3; cursor: default; }

.btn-text-ghost {
  background: none; border: none;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--mute); cursor: pointer;
  font-family: inherit;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 0; margin-top: 20px;
  transition: color 0.15s;
}
.btn-text-ghost:hover { color: var(--light); }

/* ── Status messages ─────────────────────────────────────── */
.msg { font-size: 11px; letter-spacing: 0.04em; min-height: 16px; margin-bottom: 14px; }
.msg.error { color: #f87171; }
.msg.success { color: #4ade80; }

/* ── Spinner ─────────────────────────────────────────────── */
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 1.5px solid rgba(255,255,255,0.2); border-top-color: #fff;
  border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Feedback section ────────────────────────────────────── */
#feedback-section {
  min-height: 100vh;
  padding: calc(56px + 40px) clamp(20px, 5vw, 48px) 80px;
  max-width: 760px; margin: 0 auto;
}
.fb-page-header {
  margin-bottom: 40px;
  border-bottom: 1px solid var(--hairline);
  padding-bottom: 28px;
}
.fb-page-eyebrow {
  font-size: 10px; font-weight: 400;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--mute); margin-bottom: 10px;
}
.fb-page-title {
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 800; letter-spacing: 0.04em;
  text-transform: uppercase; line-height: 0.95;
  color: var(--light);
}

/* ── Feedback items ──────────────────────────────────────── */
.fb-item {
  border: 1px solid var(--hairline);
  background: var(--night-soft);
  margin-bottom: 8px;
}
.fb-item-header {
  padding: 20px 24px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: background 0.1s;
}
.fb-item-header:hover { background: rgba(255,255,255,0.02); }
.fb-item-date {
  font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--on-mute); margin-bottom: 6px;
}
.fb-item-unit {
  font-size: 17px; font-weight: 700; letter-spacing: 0.01em;
  color: var(--light); line-height: 1.2;
}
.fb-chevron { color: var(--hairline); transition: transform 0.2s; flex-shrink: 0; }
.fb-item.open .fb-chevron { transform: rotate(90deg); color: var(--light); }
.fb-item-body { display: none; border-top: 1px solid var(--hairline); }
.fb-item.open .fb-item-body { display: block; }

.fb-section {
  padding: 20px 24px;
  border-bottom: 1px solid var(--hairline);
}
.fb-section:last-child { border-bottom: none; }
.fb-section-label {
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--mute); margin-bottom: 10px;
}
.fb-section-text {
  font-size: 14px; line-height: 1.75;
  color: var(--on-mute);
  white-space: pre-wrap; word-break: break-word;
}
.fb-section-text a { color: var(--light); text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }

/* ── Attendance chips ────────────────────────────────────── */
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 12px; border-radius: 2px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase;
}
.chip-attend { border: 1px solid rgba(21,128,61,0.5); color: #4ade80; background: rgba(21,128,61,0.1); }
.chip-absent { border: 1px solid rgba(185,28,28,0.5); color: #f87171; background: rgba(185,28,28,0.1); }

/* ── Student memos ───────────────────────────────────────── */
.student-item { margin-bottom: 14px; }
.student-item:last-child { margin-bottom: 0; }
.student-name {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--light); margin-bottom: 4px;
}
.student-note { font-size: 13px; color: var(--on-mute); line-height: 1.6; }

/* ── Change PIN section ──────────────────────────────────── */
#change-pin-section {
  display: none;
  max-width: 760px; margin: 0 auto;
  padding: 0 clamp(20px, 5vw, 48px) 40px;
}
.change-pin-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--mute); margin-bottom: 24px;
  display: flex; align-items: center; gap: 14px;
}
.change-pin-label::after { content: ''; flex: 1; height: 1px; background: var(--hairline); }
.change-card {
  border: 1px solid var(--hairline);
  background: var(--night-soft);
  padding: 32px;
  max-width: 380px;
}
</style>
</head>
<body>

<!-- ── Fixed nav ─────────────────────────────────────────── -->
<nav id="topnav">
  <span class="brand">Runners LRS</span>
  <button class="nav-btn" id="btn-change-pin" onclick="toggleChangePin()">PIN 변경</button>
</nav>

<!-- ── Hero (login / setup) ──────────────────────────────── -->
<div class="hero" id="hero-section">
  <div class="eyebrow">
    <div class="rule"></div>
    <span class="eyebrow-text">영어 인터뷰 수업 포털</span>
    <div class="rule"></div>
  </div>
  <h1 class="hero-title">Gangwon FC U-18</h1>
  <p class="hero-sub">Runners LRS × Gangwon FC</p>

  <!-- 최초 PIN 설정 -->
  <div id="setup-section" style="display:none; width:100%; max-width:380px;">
    <div class="auth-card">
      <div class="card-label">첫 방문</div>
      <div class="card-title">비밀번호 설정</div>
      <div class="card-desc">구단 전용 6자리 비밀번호를 처음 설정합니다.</div>
      <div class="pin-boxes" id="setup-boxes">
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      </div>
      <div class="msg" id="setup-msg"></div>
      <button class="btn-ghost-pill" id="setup-btn" disabled onclick="doSetPin()">설정하기</button>
    </div>
  </div>

  <!-- 로그인 -->
  <div id="login-section" style="display:none; width:100%; max-width:380px;">
    <div class="auth-card">
      <div class="card-label">레슨 피드백</div>
      <div class="card-title">비밀번호 입력</div>
      <div class="card-desc">구단 전용 6자리 비밀번호를 입력하세요.</div>
      <div class="pin-boxes" id="login-boxes">
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      </div>
      <div class="msg" id="login-msg"></div>
      <button class="btn-ghost-pill" id="login-btn" disabled onclick="doLogin()">확인하기</button>
    </div>
  </div>
</div>

<!-- ── Feedback list ──────────────────────────────────────── -->
<div id="feedback-section" style="display:none;">
  <div class="fb-page-header">
    <div class="fb-page-eyebrow">Runners LRS × Gangwon FC U-18</div>
    <div class="fb-page-title">레슨 피드백</div>
  </div>
  <div id="feedback-list"></div>
  <button class="btn-text-ghost" onclick="doLogout()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    로그아웃
  </button>
</div>

<!-- ── Change PIN ─────────────────────────────────────────── -->
<div id="change-pin-section">
  <div class="change-pin-label">PIN 변경</div>
  <div class="change-card">
    <div class="card-label">새 비밀번호</div>
    <div class="card-title">비밀번호 변경</div>
    <div class="card-desc" style="margin-bottom:28px;">변경할 6자리 비밀번호를 입력하세요.</div>
    <div class="pin-boxes" id="new-pin-boxes">
      <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
      <input type="tel" maxlength="1" inputmode="numeric" autocomplete="off" />
    </div>
    <div class="msg" id="change-msg"></div>
    <button class="btn-ghost-pill" id="change-btn" disabled onclick="doChangePin()">변경하기</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL  = 'https://ualucbrrfvysmfytkdew.supabase.co';
const SB_ANON = 'sb_publishable_nmqBIh-y6etZMXmxrUxbqA_t5uIIIOp';
const sb = supabase.createClient(SB_URL, SB_ANON);
const CLUB_ID = 'gangwon';

const UNIT_LABELS = {
  unit1: 'Unit 1 — Self-Introduction & Joining the Team',
  unit2: 'Unit 2 — Win / Lose Interview'
};

/* ── PIN box helper ──────────────────────────────────────── */
function initPin(boxId, btnId, onSubmit) {
  const inputs = Array.from(document.querySelectorAll(`#${boxId} input`));
  const btn    = document.getElementById(btnId);
  const getVal = () => inputs.map(el => el.value).join('');
  const reset  = () => { inputs.forEach(el => { el.value = ''; el.classList.remove('filled'); }); btn.disabled = true; };

  inputs.forEach((input, i) => {
    input.addEventListener('input', () => {
      const d = input.value.replace(/\D/g, '').slice(-1);
      input.value = d;
      input.classList.toggle('filled', !!d);
      if (d && i < inputs.length - 1) inputs[i + 1].focus();
      btn.disabled = getVal().length < 6;
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !input.value && i > 0) {
        e.preventDefault();
        inputs[i - 1].value = ''; inputs[i - 1].classList.remove('filled'); inputs[i - 1].focus(); btn.disabled = true;
      } else if (e.key === 'Enter' && getVal().length === 6) onSubmit();
    });
    input.addEventListener('paste', e => {
      e.preventDefault();
      const digits = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
      inputs.forEach((el, j) => { el.value = digits[j] || ''; el.classList.toggle('filled', !!digits[j]); });
      btn.disabled = digits.length < 6;
      inputs[Math.min(digits.length, 5)].focus();
    });
    input.addEventListener('focus', () => input.select());
  });

  return { getVal, reset };
}

const setupPin = initPin('setup-boxes', 'setup-btn', doSetPin);
const loginPin = initPin('login-boxes', 'login-btn', doLogin);
const newPin   = initPin('new-pin-boxes', 'change-btn', doChangePin);

/* ── Init: PIN 존재 여부 확인 ────────────────────────────── */
async function checkSetup() {
  const { data } = await sb.from('b2b_club_pins').select('pin').eq('club_id', CLUB_ID).maybeSingle();
  if (data) {
    document.getElementById('login-section').style.display = 'block';
  } else {
    document.getElementById('setup-section').style.display = 'block';
  }
}
checkSetup();

/* ── Set PIN (최초) ──────────────────────────────────────── */
async function doSetPin() {
  const pin   = setupPin.getVal();
  const btn   = document.getElementById('setup-btn');
  const msgEl = document.getElementById('setup-msg');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const { error } = await sb.from('b2b_club_pins').insert({ club_id: CLUB_ID, pin });

  btn.innerHTML = '설정하기';
  if (error) {
    msgEl.className = 'msg error'; msgEl.textContent = '오류: ' + error.message;
    btn.disabled = false; return;
  }

  document.getElementById('hero-section').style.display = 'none';
  document.getElementById('feedback-section').style.display = 'block';
  document.getElementById('btn-change-pin').classList.add('visible');
  loadFeedback();
}

/* ── Login ───────────────────────────────────────────────── */
async function doLogin() {
  const pin   = loginPin.getVal();
  const btn   = document.getElementById('login-btn');
  const msgEl = document.getElementById('login-msg');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const { data, error } = await sb.from('b2b_club_pins').select('pin').eq('club_id', CLUB_ID).single();

  btn.innerHTML = '확인하기';

  if (error || !data) {
    msgEl.className = 'msg error'; msgEl.textContent = '오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
    btn.disabled = false; return;
  }
  if (data.pin !== pin) {
    msgEl.className = 'msg error'; msgEl.textContent = '비밀번호가 일치하지 않습니다.';
    loginPin.reset(); return;
  }

  document.getElementById('hero-section').style.display = 'none';
  document.getElementById('feedback-section').style.display = 'block';
  document.getElementById('btn-change-pin').classList.add('visible');
  loadFeedback();
}

/* ── Load feedback ───────────────────────────────────────── */
async function loadFeedback() {
  const list = document.getElementById('feedback-list');
  list.innerHTML = '<div style="color:var(--mute);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;padding:8px 0;">불러오는 중...</div>';

  const { data, error } = await sb
    .from('b2b_lesson_feedback').select('*')
    .eq('club_id', CLUB_ID)
    .order('lesson_date', { ascending: false });

  if (error || !data || !data.length) {
    list.innerHTML = '<div style="color:var(--mute);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;padding:8px 0;">등록된 피드백이 없습니다.</div>';
    return;
  }
  list.innerHTML = '';
  data.forEach(fb => list.appendChild(buildItem(fb)));
}

function buildItem(fb) {
  const unitLabel = UNIT_LABELS[fb.unit] || fb.unit || '—';
  const dateStr   = fb.lesson_date
    ? new Date(fb.lesson_date + 'T00:00:00').toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })
    : '—';

  const item = document.createElement('div');
  item.className = 'fb-item';

  const sections = [];

  const attendees = fb.attendees || [];
  const absentees = fb.absentees || [];
  if (attendees.length || absentees.length) {
    let html = '';
    if (attendees.length) html += `<div class="fb-section-label" style="margin-bottom:8px;">출석</div><div class="chip-group">${attendees.map(n => `<span class="chip chip-attend">✓ ${escHtml(n)}</span>`).join('')}</div>`;
    if (absentees.length) html += `${attendees.length ? '<div style="margin-top:12px;"></div>' : ''}<div class="fb-section-label" style="margin-bottom:8px;">결석</div><div class="chip-group">${absentees.map(n => `<span class="chip chip-absent">✗ ${escHtml(n)}</span>`).join('')}</div>`;
    sections.push(`<div class="fb-section">${html}</div>`);
  }

  if (fb.lesson_content) {
    sections.push(`<div class="fb-section"><div class="fb-section-label">수업 내용</div><div class="fb-section-text">${linkify(fb.lesson_content)}</div></div>`);
  }

  if (fb.student_notes && fb.student_notes.length) {
    const notes = fb.student_notes.map(s =>
      `<div class="student-item"><div class="student-name">${escHtml(s.name || '—')}</div><div class="student-note">${escHtml(s.note || '—')}</div></div>`
    ).join('');
    sections.push(`<div class="fb-section"><div class="fb-section-label">학생별 메모</div>${notes}</div>`);
  }

  if (fb.homework) {
    sections.push(`<div class="fb-section"><div class="fb-section-label">숙제</div><div class="fb-section-text">${linkify(fb.homework)}</div></div>`);
  }

  item.innerHTML = `
    <div class="fb-item-header" onclick="this.parentElement.classList.toggle('open')">
      <div>
        <div class="fb-item-date">${dateStr}</div>
        <div class="fb-item-unit">${escHtml(unitLabel)}</div>
      </div>
      <svg class="fb-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="fb-item-body">${sections.join('')}</div>
  `;
  return item;
}

/* ── Change PIN ──────────────────────────────────────────── */
function toggleChangePin() {
  const sec = document.getElementById('change-pin-section');
  sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
  if (sec.style.display === 'block') { newPin.reset(); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  document.getElementById('change-msg').textContent = '';
}

async function doChangePin() {
  const pin   = newPin.getVal();
  const btn   = document.getElementById('change-btn');
  const msgEl = document.getElementById('change-msg');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const { error } = await sb.from('b2b_club_pins')
    .update({ pin, updated_at: new Date().toISOString() }).eq('club_id', CLUB_ID);

  btn.innerHTML = '변경하기';
  if (error) { msgEl.className = 'msg error'; msgEl.textContent = '변경 실패: ' + error.message; btn.disabled = false; }
  else { msgEl.className = 'msg success'; msgEl.textContent = '비밀번호가 변경되었습니다.'; newPin.reset(); }
}

/* ── Logout ──────────────────────────────────────────────── */
function doLogout() {
  document.getElementById('feedback-section').style.display = 'none';
  document.getElementById('change-pin-section').style.display = 'none';
  document.getElementById('btn-change-pin').classList.remove('visible');
  document.getElementById('hero-section').style.display = 'flex';
  document.getElementById('login-msg').textContent = '';
  loginPin.reset();
  setupPin.reset();
}

/* ── Helpers ─────────────────────────────────────────────── */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function linkify(str) {
  return str.split(/(https?:\/\/[^\s]+)/g).map((p, i) =>
    i % 2 === 1
      ? `<a href="${p}" target="_blank" rel="noopener noreferrer">${escHtml(p)}</a>`
      : escHtml(p)
  ).join('');
}
