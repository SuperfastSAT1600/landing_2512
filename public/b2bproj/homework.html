<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숙제 현황판 · 러너스 LRS</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --night:   #000000;
  --night-s: #0a0a0a;
  --white:   #ffffff;
  --mute:    #5a5a5f;
  --muted:   #8a8a8f;
  --line:    #2a2a2f;
  --bg-l:    #f4f7fa;
  --max:     1080px;
  --pad:     clamp(24px, 5vw, 80px);
}

html { scroll-behavior: smooth; }
body {
  background: var(--night);
  color: var(--white);
  font-family: Arial, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ── Nav ────────────────────────────────────────────────── */
#topnav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 0.5px solid var(--line);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 var(--pad); height: 48px;
}
.brand { font-size: 11px; font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; }
.nav-back {
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--mute); text-decoration: none; transition: color 0.15s;
}
.nav-back:hover { color: var(--white); }

/* ── Main ───────────────────────────────────────────────── */
.main {
  max-width: var(--max);
  margin: 0 auto;
  padding: 64px var(--pad) 120px;
}

/* ── Header ─────────────────────────────────────────────── */
.page-eyebrow {
  font-size: 9px; letter-spacing: 0.36em;
  text-transform: uppercase; color: var(--mute);
  display: block; margin-bottom: 20px;
}
.page-title {
  font-size: clamp(32px, 5vw, 56px);
  font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; line-height: 0.94;
  margin-bottom: 40px;
}
.hl { height: 0.5px; background: var(--line); margin-bottom: 40px; }

/* ── Unit selector ──────────────────────────────────────── */
.unit-tabs {
  display: flex; gap: 0; margin-bottom: 48px;
  border-bottom: 0.5px solid var(--line);
  overflow-x: auto;
}
.unit-tab {
  padding: 10px 20px;
  font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--mute); cursor: pointer;
  border-bottom: 1.5px solid transparent;
  margin-bottom: -0.5px;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.unit-tab:hover { color: var(--white); }
.unit-tab.active { color: var(--white); border-bottom-color: var(--white); }

/* ── Stats row ──────────────────────────────────────────── */
.stats-row {
  display: flex; gap: 32px;
  margin-bottom: 40px;
}
.stat-box {
  display: flex; flex-direction: column; gap: 4px;
}
.stat-num {
  font-size: clamp(28px, 4vw, 44px);
  font-weight: 700; letter-spacing: 0.04em;
  color: var(--white); line-height: 1;
}
.stat-label {
  font-size: 9px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--mute);
}

/* ── Submission cards ───────────────────────────────────── */
.cards { display: flex; flex-direction: column; gap: 0; }
.card {
  padding: 28px 0;
  border-top: 0.5px solid var(--line);
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 32px;
}
@media (max-width: 600px) {
  .card { grid-template-columns: 1fr; gap: 16px; }
}
.card:last-child { border-bottom: 0.5px solid var(--line); }
.card-meta {}
.card-name {
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--white); margin-bottom: 6px;
}
.card-time { font-size: 10px; color: var(--line); }
.card-body { display: flex; flex-direction: column; gap: 12px; }
.card-field { display: grid; grid-template-columns: 80px 1fr; gap: 12px; align-items: start; }
.card-field-label {
  font-size: 8px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--mute);
  padding-top: 2px;
}
.card-field-val {
  font-size: 14px; color: var(--muted); line-height: 1.65;
  white-space: pre-wrap;
}
.card-kakao {
  font-size: 10px; color: var(--mute); letter-spacing: 0.08em;
}

/* ── Empty / Loading states ─────────────────────────────── */
.state-msg {
  padding: 60px 0;
  font-size: 13px; color: var(--mute);
  letter-spacing: 0.06em;
}
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 1.5px solid var(--line);
  border-top-color: var(--muted);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-right: 10px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Refresh btn ────────────────────────────────────────── */
.refresh-btn {
  background: none; border: 0.5px solid var(--line);
  color: var(--mute); font-family: Arial;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  padding: 6px 16px; border-radius: 20px; cursor: pointer;
  transition: all 0.15s; margin-left: auto; display: block;
  margin-bottom: 20px;
}
.refresh-btn:hover { border-color: var(--white); color: var(--white); }
</style>
</head>
<body>

<nav id="topnav">
  <span class="brand">러너스 LRS</span>
  <a href="unit2.html" class="nav-back">← 수업으로</a>
</nav>

<div class="main">
  <span class="page-eyebrow">숙제 현황판 &nbsp;·&nbsp; 강원 U-18 영어 인터뷰 수업</span>
  <h1 class="page-title">Homework<br>Board</h1>
  <div class="hl"></div>

  <!-- Unit 탭 -->
  <div class="unit-tabs" id="unit-tabs">
    <div class="unit-tab active" data-unit="unit1" onclick="selectUnit('unit1', this)">Unit 1</div>
    <div class="unit-tab" data-unit="unit2" onclick="selectUnit('unit2', this)">Unit 2</div>
    <div class="unit-tab" data-unit="unit3" onclick="selectUnit('unit3', this)">Unit 3</div>
    <div class="unit-tab" data-unit="unit4" onclick="selectUnit('unit4', this)">Unit 4</div>
    <div class="unit-tab" data-unit="unit5" onclick="selectUnit('unit5', this)">Unit 5</div>
    <div class="unit-tab" data-unit="unit6" onclick="selectUnit('unit6', this)">Unit 6</div>
  </div>

  <!-- 통계 -->
  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-num" id="stat-count">—</div>
      <div class="stat-label">제출 완료</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-latest">—</div>
      <div class="stat-label">최근 제출</div>
    </div>
  </div>

  <button class="refresh-btn" onclick="loadSubmissions()">새로고침</button>

  <!-- 카드 목록 -->
  <div id="cards-area">
    <div class="state-msg"><span class="spinner"></span>불러오는 중…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL  = 'https://ualucbrrfvysmfytkdew.supabase.co';
const SB_ANON = 'sb_publishable_nmqBIh-y6etZMXmxrUxbqA_t5uIIIOp';
const sb = window.supabase.createClient(SB_URL, SB_ANON);

let currentUnit = 'unit1';

// URL hash로 unit 복원
if (location.hash) {
  const h = location.hash.replace('#', '');
  if (['unit1','unit2','unit3','unit4','unit5','unit6'].includes(h)) {
    currentUnit = h;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  // 탭 초기 active 세팅
  document.querySelectorAll('.unit-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.unit === currentUnit);
  });
  loadSubmissions();
});

function selectUnit(unit, el) {
  currentUnit = unit;
  document.querySelectorAll('.unit-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  location.hash = unit;
  loadSubmissions();
}

async function loadSubmissions() {
  const area = document.getElementById('cards-area');
  area.innerHTML = '<div class="state-msg"><span class="spinner"></span>불러오는 중…</div>';
  document.getElementById('stat-count').textContent = '—';
  document.getElementById('stat-latest').textContent = '—';

  const { data, error } = await sb
    .from('b2b_homework_submissions')
    .select('student_name, rewatch_answer, prepare_answer, submitted_at')
    .eq('unit', currentUnit)
    .order('submitted_at', { ascending: false });

  if (error) {
    area.innerHTML = `<div class="state-msg">오류: ${esc(error.message)}</div>`;
    return;
  }

  // Stats
  document.getElementById('stat-count').textContent = data.length;
  if (data.length > 0) {
    document.getElementById('stat-latest').textContent = fmtRelative(data[0].submitted_at);
  } else {
    document.getElementById('stat-latest').textContent = '없음';
  }

  if (data.length === 0) {
    area.innerHTML = '<div class="state-msg">아직 제출된 숙제가 없습니다.</div>';
    return;
  }

  area.innerHTML = '<div class="cards">' + data.map(r => `
    <div class="card">
      <div class="card-meta">
        <div class="card-name">${esc(r.student_name)}</div>
        <div class="card-time">${fmtDate(r.submitted_at)}</div>
      </div>
      <div class="card-body">
        ${r.rewatch_answer ? `
          <div class="card-field">
            <span class="card-field-label">Rewatch</span>
            <span class="card-field-val">${esc(r.rewatch_answer)}</span>
          </div>` : ''}
        ${r.prepare_answer ? `
          <div class="card-field">
            <span class="card-field-label">Prepare</span>
            <span class="card-field-val">${esc(r.prepare_answer)}</span>
          </div>` : ''}
        <div class="card-field">
          <span class="card-field-label">Record</span>
          <span class="card-kakao">카카오톡으로 제출</span>
        </div>
      </div>
    </div>`).join('') + '</div>';
}

function esc(s) { return String(s || '').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' }) + ' ' +
         d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

function fmtRelative(iso) {
  if (!iso) return '없음';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return '방금 전';
  if (m < 60) return m + '분 전';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '시간 전';
  return Math.floor(h / 24) + '일 전';
}
</script>
</body>
</html>
